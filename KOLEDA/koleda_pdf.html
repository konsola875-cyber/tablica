<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PZS 4 AV - Prezentacja i YouTube Telebim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}
#slide-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.55s ease-in-out;z-index:10}
#slide-screen.visible{opacity:1}
.slide-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 0.45s ease-in-out}
#web-frame{width:100vw;height:100vh;border:none;display:none;background:#000;transform:scale(1.14);transition:opacity 0.35s ease;pointer-events:none}
#stinger-vid{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:50;pointer-events:none;opacity:0}
#ad-vid,#ad-vid-b{position:absolute;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;display:none;z-index:5;transition:transform 0.55s cubic-bezier(0.22,1,0.36,1)}
#pdf-blackout{position:fixed;inset:0;z-index:99999;background:#000;opacity:0;pointer-events:none;transition:opacity 0.25s ease}
#pdf-blackout.active{opacity:1}
</style>
</head>
<body>
<div id="slide-screen">
    <img id="slide-img-a" class="slide-layer" src="" alt="">
    <img id="slide-img-b" class="slide-layer" src="" alt="">
    <iframe id="web-frame" src="" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe><video id="ad-vid" src="" loop playsinline></video><video id="ad-vid-b" src="" playsinline></video>
    <video id="ad-vid" src="" loop playsinline></video>
    <video id="ad-vid-b" src="" playsinline></video>
</div>
<video id="stinger-vid" src="stinger_samochodowka_pzs4.webm.webm" preload="auto" muted playsinline></video>
<canvas id="tytani-stinger-canvas" width="1920" height="1080" style="position:fixed;inset:0;width:100vw;height:100vh;z-index:60;pointer-events:none;display:none"></canvas>
</div>
</div>

<div id="pdf-blackout"></div>
<script>
const TOPIC_PREFIX = "pzs4-wejherowo-av-2026/";
let cachedSlides = new Array();
let activeLayer = 'a';
let adActiveMemory = false;
let savedAdUrl = "";
let savedAdLoop = true;
let savedAdMuted = false;
let savedAdTime = 0;
let pdfCurrentTheme = "xmas";
let lineupPipMeta = [];

const stingerEl = document.getElementById('stinger-vid');
stingerEl.onerror = () => {
    if (!stingerEl.src.endsWith('.webm.webm')) {
        stingerEl.src = 'stinger_samochodowka_pzs4.webm.webm';
        stingerEl.load();
    }
};

function showSlide(dataUrl){
    const scr=document.getElementById('slide-screen');
    const imgA=document.getElementById('slide-img-a');
    const imgB=document.getElementById('slide-img-b');
    const frm=document.getElementById('web-frame');
    if(!dataUrl) return;

    frm.style.display='none';
    frm.src='about:blank';

    const nextImg = (activeLayer === 'a') ? imgB : imgA;
    const prevImg = (activeLayer === 'a') ? imgA : imgB;
    activeLayer = (activeLayer === 'a') ? 'b' : 'a';

    nextImg.onload = () => {
        nextImg.style.zIndex = 2;
        prevImg.style.zIndex = 1;
        nextImg.style.opacity = 1;
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');
        setTimeout(() => { prevImg.style.opacity = 0; }, 460);
    };
    nextImg.src = dataUrl;
}

function extractYoutubeId(url){
    const reg = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/;
    const match = url.match(reg);
    return match ? match.at(1) : null;
}

function showWebUrl(rawUrl){
    const scr=document.getElementById('slide-screen');
    const imgA=document.getElementById('slide-img-a');
    const imgB=document.getElementById('slide-img-b');
    const frm=document.getElementById('web-frame');
    if(!rawUrl) return;

    const cleanUrl = rawUrl.trim();
    const ytId = extractYoutubeId(cleanUrl);

    if(ytId){
        const ytBase = ["https", "://", "www", ".", "youtube", ".", "com", "/embed/", ytId].join("");
        const embedUrl = new URL(ytBase);
        embedUrl.searchParams.set("autoplay", "1");
        embedUrl.searchParams.set("mute", "1");
        embedUrl.searchParams.set("enablejsapi", "1");
        embedUrl.searchParams.set("rel", "0");

        imgA.style.opacity = 0;
        imgB.style.opacity = 0;
        frm.style.display = 'block';
        frm.style.opacity = 1;
        frm.src = embedUrl.toString();
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');

        setTimeout(() => {
            ytControl('unMute', new Array());
            ytControl('setVolume', new Array(100));
            ytControl('playVideo', new Array());
        }, 1200);
        return;
    }

    const testImg = new Image();
    testImg.onload = () => showSlide(cleanUrl);
    testImg.onerror = () => {
        imgA.style.opacity = 0;
        imgB.style.opacity = 0;
        frm.style.display = 'block';
        frm.style.opacity = 1;
        frm.src = cleanUrl;
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');
    };
    testImg.src = cleanUrl;
}

function ytControl(cmd, args=new Array()){
    const frm=document.getElementById('web-frame');
    if(!frm || !frm.contentWindow) return;
    if(cmd === 'pauseVideo'){
        frm.style.opacity = 0;
        setTimeout(()=>frm.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args}),"*"), 300);
    } else {
        frm.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args}),"*");
        if(cmd === 'playVideo') setTimeout(()=>{ frm.style.opacity = 1; }, 250);
    }
}

const tytaniLogoImg = new Image();
tytaniLogoImg.src = "logo_tytani.png";
const tsSparks = Array.from({length: 65}, () => ({
    angle: Math.random() * Math.PI * 2,
    speed: 250 + Math.random() * 850,
    size: 3 + Math.random() * 6,
    gold: Math.random() > 0.35
}));

function tsEaseInOutCubic(t){ return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; }
function tsEaseOutBack(t){ const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }

function drawTytaniStingerFrame(ctx, progress){
    ctx.clearRect(0, 0, 1920, 1080);

    let curtainP = 0;
    if (progress < 0.32) curtainP = tsEaseInOutCubic(progress / 0.32);
    else if (progress <= 0.68) curtainP = 1;
    else curtainP = 1 - tsEaseInOutCubic((progress - 0.68) / 0.32);

    if (curtainP > 0) {
        const halfW = 960 * curtainP;
        const gradL = ctx.createLinearGradient(0, 0, halfW, 1080);
        gradL.addColorStop(0, '#09090b');
        gradL.addColorStop(0.65, '#4a0000');
        gradL.addColorStop(1, '#9b0000');
        ctx.fillStyle = gradL;
        ctx.fillRect(0, 0, halfW + 2, 1080);

        const gradR = ctx.createLinearGradient(1920, 0, 1920 - halfW, 1080);
        gradR.addColorStop(0, '#09090b');
        gradR.addColorStop(0.65, '#4a0000');
        gradR.addColorStop(1, '#9b0000');
        ctx.fillStyle = gradR;
        ctx.fillRect(1920 - halfW - 2, 0, halfW + 2, 1080);

        ctx.fillStyle = '#ffcc00';
        ctx.shadowColor = '#ffcc00';
        ctx.shadowBlur = 25;
        ctx.fillRect(halfW - 10, 0, 10, 1080);
        ctx.fillRect(1920 - halfW, 0, 10, 1080);
        ctx.shadowBlur = 0;
    }

    if (progress >= 0.28 && progress <= 0.65) {
        const flashT = (progress - 0.28) / 0.37;
        const radius = 60 + Math.sin(flashT * Math.PI) * 680;
        const alpha = Math.sin(flashT * Math.PI) * 0.9;
        const rad = ctx.createRadialGradient(960, 540, 10, 960, 540, radius);
        rad.addColorStop(0, `rgba(255, 255, 255, ${alpha})`);
        rad.addColorStop(0.35, `rgba(255, 204, 0, ${alpha * 0.85})`);
        rad.addColorStop(0.7, `rgba(217, 4, 41, ${alpha * 0.5})`);
        rad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = rad;
        ctx.beginPath();
        ctx.arc(960, 540, radius, 0, Math.PI * 2);
        ctx.fill();

        tsSparks.forEach(s => {
            const dist = flashT * s.speed;
            const sx = 960 + Math.cos(s.angle) * dist;
            const sy = 540 + Math.sin(s.angle) * dist;
            ctx.fillStyle = s.gold ? `rgba(255,204,0,${alpha})` : `rgba(255,60,60,${alpha})`;
            ctx.beginPath();
            ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
            ctx.fill();
        });
    }

        if (progress >= 0.30 && progress <= 0.73) {
        let logoAlpha = 1, scale = 1;
        if (progress < 0.42) {
            const t = (progress - 0.30) / 0.12;
            scale = 0.2 + 0.8 * tsEaseOutBack(t);
            logoAlpha = Math.min(1, t * 2);
        } else if (progress > 0.63) {
            const t = (progress - 0.63) / 0.10;
            logoAlpha = 1 - t;
            scale = 1 - 0.25 * t;
        }

        ctx.save();
        ctx.translate(960, 540);
        ctx.scale(scale, scale);
        ctx.globalAlpha = Math.max(0, logoAlpha);

        if (tytaniLogoImg.complete && tytaniLogoImg.naturalWidth > 0) {
            const maxH = 560;
            const ratio = tytaniLogoImg.naturalWidth / tytaniLogoImg.naturalHeight;
            const h = maxH;
            const w = maxH * ratio;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.92)';
            ctx.shadowBlur = 35;
            ctx.drawImage(tytaniLogoImg, -w / 2, -h / 2, w, h);
        } else {
            ctx.font = '900 155px Montserrat, Arial Black, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#ffcc00';
            ctx.fillText('TYTANI WEJHEROWO', 0, 40);
        }
        ctx.restore();
    }
}

function playTytaniCanvasStinger(onMidpoint){
    const c = document.getElementById('tytani-stinger-canvas');
    if(!c) return onMidpoint();
    const ctx = c.getContext('2d');
    c.style.display = 'block';
    const duration = 2800;
    const start = performance.now();
    let swapped = false;

    function step(now){
        const p = (now - start) / duration;
        if(p >= 0.5 && !swapped){
            swapped = true;
            onMidpoint();
        }
        if(p <= 1){
            drawTytaniStingerFrame(ctx, p);
            requestAnimationFrame(step);
        } else {
            ctx.clearRect(0, 0, 1920, 1080);
            c.style.display = 'none';
        }
    }
    requestAnimationFrame(step);
}

function triggerFullStinger(onPeakCallback, onEndCallback) {
    const vid = document.getElementById('stinger-vid');
    if (!vid) {
        if (onPeakCallback) onPeakCallback();
        if (onEndCallback) onEndCallback();
        return;
    }

    vid.pause();
    vid.currentTime = 0;
    vid.style.background = 'transparent';
    vid.style.transition = 'opacity 0.3s ease';
    vid.style.opacity = 0;

    let peakFired = false;
    const firePeak = () => {
        if (peakFired) return;
        peakFired = true;
        if (typeof client !== 'undefined' && client.connected) {
            client.publish(TOPIC_PREFIX + "stingerPeak", JSON.stringify({ ts: Date.now() }));
        }
        if (onPeakCallback) onPeakCallback();
    };

    vid.onplaying = () => {
        requestAnimationFrame(() => { vid.style.opacity = 1; });
    };

    const peakTimer = setTimeout(firePeak, 1500);

    // W 2650 ms zaczynamy płynne wygaszanie stingera, żeby nie było twardego cięcia granatowego tła:
    const fadeOutTimer = setTimeout(() => {
        vid.style.opacity = 0;
    }, 2650);

    const endTimer = setTimeout(() => {
        vid.onplaying = null;
        vid.style.opacity = 0;
        vid.pause();
        vid.currentTime = 0;
        if (onEndCallback) onEndCallback();
    }, 3050);

    vid.onended = () => {
        clearTimeout(fadeOutTimer);
        clearTimeout(endTimer);
        vid.onplaying = null;
        vid.style.opacity = 0;
        vid.pause();
        vid.currentTime = 0;
        if (onEndCallback) onEndCallback();
    };

    const p = vid.play();
    if (p !== undefined) {
        p.catch(() => {
            clearTimeout(peakTimer);
            clearTimeout(fadeOutTimer);
            clearTimeout(endTimer);
            vid.onplaying = null;
            vid.style.opacity = 0;
            firePeak();
            if (onEndCallback) onEndCallback();
        });
    }
}

function hideSlideWithStinger() {
    const scr = document.getElementById('slide-screen');
    triggerFullStinger(() => {
        if (scr) {
            scr.style.transition = 'none';
            scr.classList.remove('visible');
        }
    });
}

function showAdVideo(srcUrl, isLoop, isMuted, startTime){
    const scr = document.getElementById('slide-screen');
    const imgA = document.getElementById('slide-img-a');
    const imgB = document.getElementById('slide-img-b');
    const frm = document.getElementById('web-frame');
    const adVid = document.getElementById('ad-vid');
    if(!srcUrl) return;

    adActiveMemory = true;
    savedAdUrl = srcUrl;
    savedAdLoop = (isLoop !== false);
    savedAdMuted = !!isMuted;

    imgA.style.opacity = 0;
    imgB.style.opacity = 0;
    frm.style.display = 'none';
    frm.src = 'about:blank';

    adVid.loop = savedAdLoop;
    adVid.muted = savedAdMuted;

        const playFromSaved = () => {
        adVid.play().then(() => {
            if(typeof startTime === 'number' && startTime > 0){
                adVid.currentTime = startTime;
            }
        }).catch(e => console.warn("Autoplay video:", e));
    };

    if(!adVid.src.endsWith(srcUrl)){
        adVid.src = srcUrl;
        adVid.onloadedmetadata = playFromSaved;
    } else {
        playFromSaved();
    }

    adVid.style.display = 'block';
    scr.style.transition = 'opacity 0.55s ease-in-out';
    scr.classList.add('visible');
}

function pauseAdAndSaveTime(){
    const adVid = document.getElementById('ad-vid');
    if(adVid && adActiveMemory){
        if(adVid.currentTime > 0) savedAdTime = adVid.currentTime;
        adVid.pause();
    }
}

function resumeAdIfRemembered(){
    if(!adActiveMemory || !savedAdUrl) return;
    if(pdfCurrentTheme === 'tytani'){
        playTytaniCanvasStinger(() => {
            showAdVideo(savedAdUrl, savedAdLoop, savedAdMuted, savedAdTime);
        });
    } else {
        showAdVideo(savedAdUrl, savedAdLoop, savedAdMuted, savedAdTime);
    }
}

let lineupQueue = [];
let lineupIndex = 0;
let isLineupPlaying = false;
let activeLineupVid = 'a';
let lineupRunId = 0;
let lineupImgTimer = null;

function stopLineupSequence(){
    lineupRunId++;
    isLineupPlaying = false;
    clearTimeout(lineupImgTimer);
    const oldImg = document.getElementById('lineup-static-img');
    if(oldImg) oldImg.style.display = 'none';
    const vA = document.getElementById('lineup-vid-a');
    const vB = document.getElementById('lineup-vid-b');
    if(vA){ vA.pause(); vA.style.display = 'none'; }
    if(vB){ vB.pause(); vB.style.display = 'none'; }
}

function startLineupSequence(list){
    if(!Array.isArray(list) || list.length === 0) return;
    stopLineupSequence();
    pauseAdAndSaveTime();
    const adA = document.getElementById('ad-vid');
    const adB = document.getElementById('ad-vid-b');
    if(adA){ adA.style.display = 'none'; adA.style.opacity = 1; adA.style.transform = 'translateX(0%)'; }
    if(adB){ adB.style.display = 'none'; adB.style.opacity = 1; adB.style.transform = 'translateX(0%)'; }

    lineupQueue = list;
    lineupIndex = 0;
    isLineupPlaying = true;
    activeLineupVid = 'a';
    playNextLineupItem(true);

}
function playNextLineupItem(isFirst){
    const currentRun = lineupRunId;
    if(!isLineupPlaying || lineupIndex >= lineupQueue.length){
        finishLineupSequence();
        return;
    }

    const srcUrl = lineupQueue[lineupIndex];
    const currEl = document.getElementById(activeLineupVid === 'a' ? 'ad-vid' : 'ad-vid-b');
    const prevEl = document.getElementById(activeLineupVid === 'a' ? 'ad-vid-b' : 'ad-vid');

    // Wyczyść stare handlery, żeby nic z poprzedniego testu nie przeskakiwało!
    [currEl, prevEl].forEach(v => {
        if(v){ v.onended = null; v.onerror = null; v.ontimeupdate = null; }
    });

    // 1. Obsługa statycznego zdjęcia (.png / .jpg / .webp) na 5 sekund
    if(/\.(png|jpg|jpeg|webp)$/i.test(srcUrl)){
        if(currEl){ currEl.pause(); currEl.style.display = 'none'; }
        if(prevEl){ prevEl.pause(); prevEl.style.display = 'none'; }
        let imgEl = document.getElementById('lineup-static-img');
        if(!imgEl){
            imgEl = document.createElement('img');
            imgEl.id = 'lineup-static-img';
            imgEl.style.cssText = 'position:fixed;inset:0;width:100vw;height:100vh;object-fit:contain;background:#000;z-index:20;';
            document.body.appendChild(imgEl);
        }
        imgEl.src = srcUrl;
        imgEl.style.display = 'block';
        clearTimeout(lineupImgTimer);
        lineupImgTimer = setTimeout(() => {
            if(currentRun !== lineupRunId || !isLineupPlaying) return;
            imgEl.style.display = 'none';
            lineupIndex++;
            playNextLineupItem(false);
        }, 5000);
        return;
    }

    // 2. Obsługa pliku wideo (.mp4 / .webm)
    const oldImg = document.getElementById('lineup-static-img');
    if(oldImg) oldImg.style.display = 'none';

    if(!currEl){
        lineupIndex++;
        playNextLineupItem(false);
        return;
    }

    currEl.src = srcUrl;
    currEl.loop = false;
    currEl.muted = false;
    currEl.style.display = 'block';
    currEl.style.opacity = '1';
    currEl.style.transform = 'translateX(0%)';
    if(prevEl){ prevEl.pause(); prevEl.style.display = 'none'; }

    const advanceNext = () => {
        if(currentRun !== lineupRunId || !isLineupPlaying) return;
        currEl.onended = null;
        currEl.onerror = null;
        activeLineupVid = (activeLineupVid === 'a') ? 'b' : 'a';
        lineupIndex++;
        playNextLineupItem(false);
    };

    currEl.onended = advanceNext;
    currEl.onerror = advanceNext;
    currEl.play().catch(advanceNext);
}

function finishLineupSequence(){
    lineupRunId++;
    clearTimeout(lineupImgTimer);
    const oldImg = document.getElementById('lineup-static-img');
    if(oldImg) oldImg.style.display = 'none';
    isLineupPlaying = false;
    lineupQueue = [];
    const adA = document.getElementById('ad-vid');
    const adB = document.getElementById('ad-vid-b');

    const cleanupAndResume = () => {
        [adA, adB].forEach(v => {
            if(v){
                v.onended = null;
                v.onerror = null;
                v.ontimeupdate = null;
                v.pause();
                v.style.transition = 'none';
                v.style.transform = 'translateX(0%)';
                v.style.opacity = 1;
            }
        });
        if(adB) adB.style.display = 'none';

        if(adActiveMemory && savedAdUrl){
            showAdVideo(savedAdUrl, savedAdLoop, savedAdMuted, savedAdTime);
        } else {
            const scr = document.getElementById('slide-screen');
            if(scr){ scr.style.transition = 'none'; scr.classList.remove('visible'); }
            if(adA){ adA.pause(); adA.style.display = 'none'; }
        }
    };

    if(pdfCurrentTheme === 'tytani'){
        playTytaniCanvasStinger(cleanupAndResume);
    } else {
        cleanupAndResume();
    }
}

function controlAdVideo(cmd, val){
    const adVid = document.getElementById('ad-vid');
    if(!adVid) return;
    if(cmd === 'play') adVid.play().catch(()=>{});
    if(cmd === 'pause') adVid.pause();
    if(cmd === 'loop') adVid.loop = !!val;
    if(cmd === 'mute') adVid.muted = !!val;
}

const mqttLib = document.createElement('script');
mqttLib.src = "mqtt.min.js";
mqttLib.onload = () => {
    const brokerUrl = ["wss", "://", "broker", ".", "hivemq", ".", "com", ":8884/mqtt"].join("");
    const client = mqtt.connect(brokerUrl, {
        reconnectPeriod: 2000,
        keepalive: 30
    });

    client.on("connect", () => {
        client.subscribe(TOPIC_PREFIX + "pdf");
        client.subscribe(TOPIC_PREFIX + "slide_item/#");
        client.subscribe(TOPIC_PREFIX + "theme");
        client.subscribe(TOPIC_PREFIX + "tournament");
        client.subscribe(TOPIC_PREFIX + "blackout");
    });

    client.on("message", (topic, message) => {
        try {
            const d = JSON.parse(message.toString());
            if (topic.startsWith(TOPIC_PREFIX + "slide_item/")) {
                if (d.img) cachedSlides[d.idx] = d.img;
                return;
            }
                        if (topic === TOPIC_PREFIX + "blackout") {
                const pb = document.getElementById('pdf-blackout');
                if(pb) pb.classList.toggle('active', !!d.active);
            }
            if (d.action === 'showSlideIdx'){
                if (cachedSlides[d.idx]) showSlide(cachedSlides[d.idx]);
                else if (d.img) { cachedSlides[d.idx] = d.img; showSlide(d.img); }
            }
            if (d.action === 'showSlide') showSlide(d.img);
            if (d.action === 'showUrl') showWebUrl(d.url);
            if (d.action === 'playVideo' || d.action === 'ytPlay') ytControl('playVideo');
            if (d.action === 'pauseVideo' || d.action === 'ytPause') ytControl('pauseVideo');
            if (d.action === 'hideSlide') hideSlideWithStinger();
            if (d.action === 'playStinger') {
            triggerFullStinger();
}
            if (d.action === 'hideSlideSilent') {
    const scr = document.getElementById('slide-screen');
    if (scr) {
        scr.style.transition = 'none';
        scr.classList.remove('visible');
    }
}
            if (d.action === 'hideSlideSilent') {
    const scr = document.getElementById('slide-screen');
    if (scr) {
        scr.style.transition = 'opacity 0.2s ease';
        scr.classList.remove('visible');
    }
}
            if (d.action === 'playStingerOnly'){
                const vid = document.getElementById('stinger-vid');
                if(vid){
                    vid.pause();
                    vid.currentTime = 0;
                    vid.style.opacity = 1;
                    vid.play().catch(() => { vid.style.opacity = 0; });
                    vid.onended = () => { vid.style.opacity = 0; };
                }
            }
            if (d.action === 'showAdVideo') showAdVideo(d.url, d.loop, d.muted);
            if (d.action === 'adPlay') controlAdVideo('play');
            if (d.action === 'adPause') controlAdVideo('pause');
            if (d.action === 'adLoop') controlAdVideo('loop', d.loop);
            if (d.action === 'adMute') controlAdVideo('mute', d.muted);
            if (d.action === 'stopAdPermanent') { adActiveMemory = false; hideSlideWithStinger(); }
            if (d.action === 'resumeAd') resumeAdIfRemembered();
            if (d.action === 'pauseAd') pauseAdAndSaveTime();
            if (d.action === 'resumeAd') resumeAdIfRemembered();
            if (topic === TOPIC_PREFIX + "theme" && d.theme) {
                pdfCurrentTheme = d.theme;
                stingerEl.src = (d.theme === 'tytani') ? 'stinger_tytani.webm' : 'stinger_samochodowka_pzs4.webm';
                stingerEl.load();
            }
            if (d.action === 'startLineup') startLineupSequence(d.list);
            if (d.action === 'stopLineup') finishLineupSequence();

        } catch (e) { console.error(e); }
    });
};
document.head.appendChild(mqttLib);
</script>
<div id="telebim-lightshow-layer" style="display:none; position:fixed; inset:0; z-index:999999; background:#000; overflow:hidden; align-items:center; justify-content:center; flex-direction:column; text-align:center; pointer-events:none;">
    <div id="lightshow-beams-wrap" style="display:none; position:absolute; inset:-35%; pointer-events:none;">
        <div class="ls-cone ls-cone-1"></div>
        <div class="ls-cone ls-cone-2"></div>
        <div class="ls-cone ls-cone-3"></div>
        <div class="ls-cone ls-cone-4"></div>
    </div>
    <div id="lightshow-text" style="display:none; position:relative; z-index:2; color:#fff; font-family:sans-serif; font-weight:900; text-transform:uppercase; padding:20px;"></div>
</div>

<style>
.ls-cone {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 150vmax;
    height: 150vmax;
    margin-left: -75vmax;
    margin-top: -75vmax;
    mix-blend-mode: screen;
    filter: blur(2px); /* ostre krawędzie wiązek bez mgły! */
}
.ls-cone-1 {
    background: conic-gradient(from 0deg,
        transparent 0deg, #ffd60a 5deg, transparent 11deg,
        transparent 60deg, #ff0054 65deg, transparent 71deg,
        transparent 120deg, #00f5d4 125deg, transparent 131deg,
        transparent 180deg, #0077b6 185deg, transparent 191deg,
        transparent 240deg, #ffbe0b 245deg, transparent 251deg,
        transparent 300deg, #b5179e 305deg, transparent 311deg);
    animation: lsOrbitCW var(--ls-dur, 4s) linear infinite;
}
.ls-cone-2 {
    background: conic-gradient(from 25deg,
        transparent 0deg, #ffffff 4deg, transparent 9deg,
        transparent 90deg, #3a86ff 95deg, transparent 101deg,
        transparent 180deg, #ffe600 185deg, transparent 191deg,
        transparent 270deg, #ff006e 275deg, transparent 281deg);
    animation: lsOrbitCCW calc(var(--ls-dur, 4s) * 1.25) linear infinite;
}
.ls-cone-3 {
    background: conic-gradient(from 12deg,
        transparent 0deg, #00e676 4deg, transparent 9deg,
        transparent 120deg, #ffd60a 124deg, transparent 130deg,
        transparent 240deg, #00bbf9 244deg, transparent 250deg);
    animation: lsOrbitCW calc(var(--ls-dur, 4s) * 0.8) linear infinite;
}
.ls-cone-4 {
    background: conic-gradient(from 40deg,
        transparent 0deg, #ff4d6d 4deg, transparent 9deg,
        transparent 180deg, #ffd60a 184deg, transparent 190deg);
    animation: lsOrbitCCW calc(var(--ls-dur, 4s) * 1.6) linear infinite;
}

@keyframes lsOrbitCW {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
@keyframes lsOrbitCCW {
    0%   { transform: rotate(360deg); }
    100% { transform: rotate(0deg); }
}
@keyframes lsFlashlightPulse {
    0%, 100% { transform: scale(1); text-shadow: 0 0 30px #ffbe0b, 0 0 80px #ffbe0b; }
    50%      { transform: scale(1.08); text-shadow: 0 0 60px #ffffff, 0 0 140px #ffbe0b; }
}
</style>

<script>
(function(){
    let lsTimer = null;
    let lsStep = 0;

        function stopLocalLightShow(instant = false){
        clearInterval(lsTimer);
        lsTimer = null;
        const layer = document.getElementById('telebim-lightshow-layer');
        const wrap = document.getElementById('lightshow-beams-wrap');
        const txt = document.getElementById('lightshow-text');
        if(!layer) return;

        if(instant){
            layer.style.transition = 'none';
            layer.style.opacity = '0';
            layer.style.display = 'none';
            if(wrap) wrap.style.display = 'none';
            if(txt) txt.style.display = 'none';
            return;
        }

        // Płynne przygasanie świateł przez 1.2 sekundy (odsłaniające Kolejność meczów pod spodem!):
        layer.style.transition = 'opacity 1.2s ease-out';
        layer.style.opacity = '0';
        setTimeout(() => {
            if(layer.style.opacity === '0'){
                layer.style.display = 'none';
                if(wrap) wrap.style.display = 'none';
                if(txt) txt.style.display = 'none';
            }
        }, 1250);
    }

            function startLocalLightShow(mode, bpm){
        stopLocalLightShow(true); // natychmiastowy reset przed startem nowego trybu
        const layer = document.getElementById('telebim-lightshow-layer');
        const wrap = document.getElementById('lightshow-beams-wrap');
        const txt = document.getElementById('lightshow-text');
        if(!layer) return;

        layer.style.opacity = '1';
        layer.style.display = 'flex';
        layer.style.transition = 'background-color 0.08s ease';
        const beatMs = Math.max(140, Math.round(60000 / (bpm || 128)));
        const durSec = Math.max(1.8, (beatMs * 8) / 1000);

        // Lasery działają TYLKO gdy tryb !== 'flashlights':
        if(wrap){
            if(mode === 'flashlights'){
                wrap.style.display = 'none';
            } else {
                wrap.style.setProperty('--ls-dur', `${durSec}s`);
                wrap.style.display = 'block';
            }
        }

        // Kręcące się ostre głowice działają w każdym trybie poza napisem Latarki:
        if(wrap && mode !== 'flashlights'){
            wrap.style.setProperty('--ls-dur', `${durSec}s`);
            wrap.style.display = 'block';
        }

        if(mode === 'strobe'){
            const palette = ['#ffffff', '#000000', '#ff002b', '#000000'];
            lsTimer = setInterval(() => {
                layer.style.backgroundColor = palette[lsStep % palette.length];
                lsStep++;
            }, Math.max(130, Math.round(beatMs / 2)));
        }
        else if(mode === 'colors'){
            // Barwy szkoły PZS 4: niebieski + dużo żółtego + akcent bieli + krążące promienie
            layer.style.transition = 'background-color 0.22s ease';
            const palette = ['#00509d', '#ffd60a', '#ffe600', '#0077b6', '#ffd60a', '#ffffff'];
            lsTimer = setInterval(() => {
                layer.style.backgroundColor = palette[lsStep % palette.length];
                lsStep++;
            }, beatMs);
        }
        else if(mode === 'scanner'){
            layer.style.backgroundColor = '#000000';
        }
        else if(mode === 'pulse'){
            // Puls basu DJ-a + obracające się kolorowe promienie!
            const colors = ['#ff0054', '#00f5d4', '#ffbe0b', '#3a86ff'];
            lsTimer = setInterval(() => {
                const c = colors[lsStep % colors.length];
                layer.style.transition = 'none';
                layer.style.backgroundColor = c;
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        layer.style.transition = `background-color ${beatMs * 0.85}ms ease-out`;
                        layer.style.backgroundColor = '#050505';
                    });
                });
                lsStep++;
            }, beatMs);
        }
        else if(mode === 'flashlights'){
            layer.style.backgroundColor = '#000000';
            txt.style.display = 'block';
            txt.innerHTML = `
                <div style="font-size:150px; line-height:1; animation: lsFlashlightPulse 1.2s infinite;">🔦📱</div>
                <div style="font-size:82px; margin-top:20px; color:#ffbe0b; letter-spacing:3px; animation: lsFlashlightPulse 1.2s infinite;">WSZYSCY LATARKI W GÓRĘ!</div>
            `;
        }
    }

        function connectLightShowMqtt(){
        // Nie odpalamy warstwy świateł na samym oknie pilota (tylko na ekranie telebimu / OBS):
        if(document.getElementById('tb-pilot-box') && !location.search.includes('screen')) return;
        if(typeof mqtt === 'undefined') return setTimeout(connectLightShowMqtt, 300);
        const prefix = (typeof TOPIC_PREFIX !== 'undefined') ? TOPIC_PREFIX : "pzs4-wejherowo-av-2026/";
        const lsClient = mqtt.connect({
            hostname: "broker.hivemq.com",
            port: 8884,
            protocol: "wss",
            path: "/mqtt",
            reconnectPeriod: 2000
        });
        lsClient.on("connect", () => lsClient.subscribe(prefix + "lightshow"));
        lsClient.on("message", (topic, message) => {
            if(topic === prefix + "lightshow"){
                try {
                    const d = JSON.parse(message.toString());
                    if(d.action === 'start') startLocalLightShow(d.mode, d.bpm);
                    else stopLocalLightShow();
                } catch(e){}
            }
        });
    }
    connectLightShowMqtt();
})();
</script>
