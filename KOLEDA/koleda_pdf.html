<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PZS 4 AV - Prezentacja i YouTube Telebim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}
#slide-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.55s ease-in-out;z-index:10}
#slide-screen.visible{opacity:1}
.slide-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 0.45s ease-in-out}
#web-frame{width:100vw;height:100vh;border:none;display:none;background:#000;transform:scale(1.14);transition:opacity 0.35s ease;pointer-events:none}
#stinger-vid{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:50;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="slide-screen">
    <img id="slide-img-a" class="slide-layer" src="" alt="">
    <img id="slide-img-b" class="slide-layer" src="" alt="">
    <iframe id="web-frame" src="" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
</div>
<video id="stinger-vid" src="stinger_samochodowka_pzs4.webm" preload="auto" muted playsinline></video>

<script>
const TOPIC_PREFIX = "pzs4-wejherowo-av-2026/";
let cachedSlides = new Array();
let activeLayer = 'a';

const stingerEl = document.getElementById('stinger-vid');
stingerEl.onerror = () => {
    if (!stingerEl.src.endsWith('.webm.webm')) {
        stingerEl.src = 'stinger_samochodowka_pzs4.webm.webm';
        stingerEl.load();
    }
};

function showSlide(dataUrl){
    const scr=document.getElementById('slide-screen');
    const imgA=document.getElementById('slide-img-a');
    const imgB=document.getElementById('slide-img-b');
    const frm=document.getElementById('web-frame');
    if(!dataUrl) return;

    frm.style.display='none';
    frm.src='about:blank';

    const nextImg = (activeLayer === 'a') ? imgB : imgA;
    const prevImg = (activeLayer === 'a') ? imgA : imgB;
    activeLayer = (activeLayer === 'a') ? 'b' : 'a';

    nextImg.onload = () => {
        nextImg.style.zIndex = 2;
        prevImg.style.zIndex = 1;
        nextImg.style.opacity = 1;
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');
        setTimeout(() => { prevImg.style.opacity = 0; }, 460);
    };
    nextImg.src = dataUrl;
}

function extractYoutubeId(url){
    const reg = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/;
    const match = url.match(reg);
    return match ? match.at(1) : null;
}

function showWebUrl(rawUrl){
    const scr=document.getElementById('slide-screen');
    const imgA=document.getElementById('slide-img-a');
    const imgB=document.getElementById('slide-img-b');
    const frm=document.getElementById('web-frame');
    if(!rawUrl) return;

    const cleanUrl = rawUrl.trim();
    const ytId = extractYoutubeId(cleanUrl);

    if(ytId){
        const ytBase = ["https", "://", "www", ".", "youtube", ".", "com", "/embed/", ytId].join("");
        const embedUrl = new URL(ytBase);
        embedUrl.searchParams.set("autoplay", "1");
        embedUrl.searchParams.set("mute", "1");
        embedUrl.searchParams.set("enablejsapi", "1");
        embedUrl.searchParams.set("rel", "0");

        imgA.style.opacity = 0;
        imgB.style.opacity = 0;
        frm.style.display = 'block';
        frm.style.opacity = 1;
        frm.src = embedUrl.toString();
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');

        setTimeout(() => {
            ytControl('unMute', new Array());
            ytControl('setVolume', new Array(100));
            ytControl('playVideo', new Array());
        }, 1200);
        return;
    }

    const testImg = new Image();
    testImg.onload = () => showSlide(cleanUrl);
    testImg.onerror = () => {
        imgA.style.opacity = 0;
        imgB.style.opacity = 0;
        frm.style.display = 'block';
        frm.style.opacity = 1;
        frm.src = cleanUrl;
        scr.style.transition = 'opacity 0.55s ease-in-out';
        scr.classList.add('visible');
    };
    testImg.src = cleanUrl;
}

function ytControl(cmd, args=new Array()){
    const frm=document.getElementById('web-frame');
    if(!frm || !frm.contentWindow) return;
    if(cmd === 'pauseVideo'){
        frm.style.opacity = 0;
        setTimeout(()=>frm.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args}),"*"), 300);
    } else {
        frm.contentWindow.postMessage(JSON.stringify({event:"command",func:cmd,args:args}),"*");
        if(cmd === 'playVideo') setTimeout(()=>{ frm.style.opacity = 1; }, 250);
    }
}

function hideSlideWithStinger(){
    const scr=document.getElementById('slide-screen');
    const vid=document.getElementById('stinger-vid');
    const frm=document.getElementById('web-frame');
    const imgA=document.getElementById('slide-img-a');
    const imgB=document.getElementById('slide-img-b');
    if(!scr.classList.contains('visible')) return;

    vid.pause();
    vid.currentTime = 0;
    vid.style.opacity = 1;

    const cleanup = () => {
        scr.style.transition = 'none';
        scr.classList.remove('visible');
        frm.src = 'about:blank';
        imgA.style.opacity = 0;
        imgB.style.opacity = 0;
    };

    const playPromise = vid.play();
    if (playPromise !== undefined) {
        playPromise.then(() => {
            setTimeout(cleanup, 1150);
        }).catch(() => {
            scr.style.transition = 'opacity 0.45s ease';
            cleanup();
            vid.style.opacity = 0;
        });
    }

    vid.onended = () => {
        vid.style.opacity = 0;
    };
}

const mqttLib = document.createElement('script');
mqttLib.src = "mqtt.min.js";
mqttLib.onload = () => {
    const brokerUrl = ["wss", "://", "broker", ".", "hivemq", ".", "com", ":8884/mqtt"].join("");
    const client = mqtt.connect(brokerUrl, {
        reconnectPeriod: 2000,
        keepalive: 30
    });

    client.on("connect", () => {
        client.subscribe(TOPIC_PREFIX + "pdf");
        client.subscribe(TOPIC_PREFIX + "slide_item/#");
    });

    client.on("message", (topic, message) => {
        try {
            const d = JSON.parse(message.toString());
            if (topic.startsWith(TOPIC_PREFIX + "slide_item/")) {
                if (d.img) cachedSlides[d.idx] = d.img;
                return;
            }
            if (d.action === 'showSlideIdx'){
                if (cachedSlides[d.idx]) showSlide(cachedSlides[d.idx]);
                else if (d.img) { cachedSlides[d.idx] = d.img; showSlide(d.img); }
            }
            if (d.action === 'showSlide') showSlide(d.img);
            if (d.action === 'showUrl') showWebUrl(d.url);
            if (d.action === 'playVideo' || d.action === 'ytPlay') ytControl('playVideo');
            if (d.action === 'pauseVideo' || d.action === 'ytPause') ytControl('pauseVideo');
            if (d.action === 'hideSlide') hideSlideWithStinger();
        } catch (e) { console.error(e); }
    });
};
document.head.appendChild(mqttLib);
</script>
</body>
</html>
