<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>PZS 4 AV - Prezentacja i Linki Telebim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:transparent;overflow:hidden;width:100vw;height:100vh}
#slide-screen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.6s ease-in-out;z-index:10}
#slide-screen.visible{opacity:1}
#slide-img{width:100%;height:100%;object-fit:contain;transition:opacity 0.3s ease;display:none}
#web-frame{width:100vw;height:100vh;border:none;display:none;background:#fff}
#stinger-vid{position:fixed;inset:0;width:100vw;height:100vh;object-fit:cover;z-index:50;pointer-events:none;opacity:0}
</style>
</head>
<body>
<div id="slide-screen">
    <img id="slide-img" src="" alt="">
    <iframe id="web-frame" src="" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; fullscreen; encrypted-media" allowfullscreen></iframe>
</div>
<video id="stinger-vid" src="stinger_samochodowka_pzs4.webm" preload="auto" muted playsinline></video>

<script>
const TOPIC_PREFIX = "pzs4-wejherowo-av-2026/";

function showSlide(dataUrl){
    const scr=document.getElementById('slide-screen');
    const img=document.getElementById('slide-img');
    const frm=document.getElementById('web-frame');
    if(!dataUrl) return;
    frm.style.display='none'; frm.src='';
    img.style.display='block';
    scr.style.transition='opacity 0.6s ease-in-out';
    img.src=dataUrl;
    img.style.opacity=1;
    scr.classList.add('visible');
}

function showWebUrl(rawUrl){
    const scr=document.getElementById('slide-screen');
    const img=document.getElementById('slide-img');
    const frm=document.getElementById('web-frame');
    if(!rawUrl) return;

    const cleanUrl = rawUrl.trim();
    const ytMatch = cleanUrl.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([a-zA-Z0-9_-]{11})/);

    if(ytMatch && ytMatch.at(1)){
        img.style.display='none';
        frm.style.display='block';
        frm.src=`https://youtube-nocookie.com{ytMatch.at(1)}?autoplay=1&rel=0&modestbranding=1`;
        scr.style.transition='opacity 0.6s ease-in-out';
        scr.classList.add('visible');
        return;
    }

    const testImg = new Image();
    testImg.onload = () => showSlide(cleanUrl);
    testImg.onerror = () => {
        img.style.display='none';
        frm.style.display='block';
        frm.src=cleanUrl;
        scr.style.transition='opacity 0.6s ease-in-out';
        scr.classList.add('visible');
    };
    testImg.src = cleanUrl;
}

function hideSlideWithStinger(){
    const scr=document.getElementById('slide-screen');
    const vid=document.getElementById('stinger-vid');
    const frm=document.getElementById('web-frame');
    if(!scr.classList.contains('visible')) return;

    let cutDone = false;
    vid.pause();
    vid.currentTime = 0;
    vid.style.opacity = 1;

    vid.ontimeupdate = () => {
        if(!cutDone && vid.currentTime >= 1.15){
            cutDone = true;
            scr.style.transition = 'none';
            scr.classList.remove('visible');
            frm.src = '';
        }
    };

    vid.onended = () => {
        vid.style.opacity = 0;
        vid.ontimeupdate = null;
    };

    vid.play().catch(()=>{
        scr.style.transition = 'opacity 0.5s ease';
        scr.classList.remove('visible');
        frm.src = '';
        vid.style.opacity = 0;
    });
}

const mqttLib = document.createElement('script');
mqttLib.src = "mqtt.min.js";
mqttLib.onload = () => {
    const client = mqtt.connect("wss:" + "//://hivemq.com", {
        reconnectPeriod: 2000,
        keepalive: 30
    });

    client.on("connect", () => {
        client.subscribe(TOPIC_PREFIX + "pdf");
    });

    client.on("message", (topic, message) => {
        try {
            const d = JSON.parse(message.toString());
            if (d.action === 'showSlide') showSlide(d.img);
            if (d.action === 'showUrl') showWebUrl(d.url);
            if (d.action === 'hideSlide') hideSlideWithStinger();
        } catch (e) { console.error(e); }
    });
};
document.head.appendChild(mqttLib);
</script>
</body>
</html>
