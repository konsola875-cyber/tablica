<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PZS 4 AV - Nakładka na Kamery</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',sans-serif;background:transparent;overflow:hidden;width:100vw;height:100vh}

/* 1. SLAJD DYREKCJI NA PEŁNY EKRAN */
#cam-slide-full{position:fixed;inset:0;z-index:45;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 1.2s ease-in-out}
#cam-slide-full.active{opacity:1}
#cam-full-img{width:100vw;height:100vh;object-fit:contain}

/* 2. PASEK PRZEWIJANY (TICKER) */
#cam-ticker-wrap{position:fixed;bottom:48px;left:9vw;z-index:30;width:82vw;height:74px;background:linear-gradient(90deg,#6b0505 0%,#b81414 50%,#6b0505 100%);border:3px solid #ffcc00;border-radius:40px;box-shadow:0 15px 40px rgba(0,0,0,0.9);display:flex;align-items:center;overflow:hidden;clip-path:inset(0 100% 0 0 round 40px);opacity:0;transition:clip-path 1.5s cubic-bezier(0.22,1,0.36,1),opacity 0.6s ease}
#cam-ticker-wrap.active{clip-path:inset(0 0% 0 0 round 40px);opacity:1}
.ticker-badge{position:relative;z-index:5;background:#ffcc00;color:#4a0404;height:100%;padding:0 28px;display:flex;align-items:center;font-weight:900;font-size:20px;letter-spacing:1.5px;text-transform:uppercase;box-shadow:6px 0 15px rgba(0,0,0,0.5);white-space:nowrap}
.ticker-track{flex:1;overflow:hidden;position:relative;height:100%;display:flex;align-items:center}
#ticker-text{position:absolute;white-space:nowrap;font-size:30px;font-weight:800;color:#fff3d6;text-shadow:0 2px 6px rgba(0,0,0,0.8);left:100%}
@keyframes marqueePass{0%{left:100%;transform:translateX(0)}100%{left:0%;transform:translateX(-100%)}}

/* MOTYW UROCZYSTY / FESTIWAL */
body.theme-gala #cam-ticker-wrap{background:linear-gradient(90deg,#0f1c30 0%,#1d3557 50%,#0f1c30 100%);border-color:#d4af37}
body.theme-gala .ticker-badge{background:linear-gradient(180deg,#ffffff 50%,#dc143c 50%);color:#0f1c30;text-shadow:0 0 8px #fff}
/* MOTYW UNIWERSALNY / SZKOLNY (FORUM, DEBATY, KONFERENCJE) */
body.theme-school #cam-ticker-wrap{background:linear-gradient(90deg,#101827 0%,#1e293b 50%,#101827 100%);border-color:#38bdf8}
body.theme-school .ticker-badge{background:linear-gradient(135deg,#0284c7 0%,#38bdf8 100%);color:#ffffff;text-shadow:0 2px 4px rgba(0,0,0,0.4)}
body.theme-school #cam-song-card{background:radial-gradient(circle at center,#1e293b 0%,#0f172a 85%,#020617 100%)}
body.theme-school #cam-wreath{display:none}
body.theme-school #cam-song-card::after{content:'';position:absolute;inset:35px;border:4px solid #38bdf8;border-radius:24px;box-shadow:inset 0 0 30px rgba(56,189,248,0.2);pointer-events:none}
body.theme-school .cam-badge,body.theme-school #cam-card-title,body.theme-school #cam-card-artist{font-family:'Montserrat',sans-serif;font-weight:900;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.9))}
body.theme-school .cam-badge{border-color:#38bdf8;background:linear-gradient(180deg,#e0f2fe 0%,#38bdf8 100%);-webkit-background-clip:text;background-clip:text}
body.theme-school #cam-card-title{background:linear-gradient(180deg,#ffffff 0%,#e2e8f0 100%);-webkit-background-clip:text;background-clip:text}
body.theme-school #cam-card-artist{background:linear-gradient(180deg,#bae6fd 0%,#38bdf8 100%);-webkit-background-clip:text;background-clip:text}


/* 3. KARTA ZAPOWIEDZI UTWORU / WYSTĘPU */
#cam-song-card{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:35;background:radial-gradient(circle at center,#a81313 0%,#5c0505 85%,#380202 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;clip-path:circle(0% at 50% 50%);opacity:0;pointer-events:none;transform-origin:bottom left;transition:clip-path 2.5s cubic-bezier(0.25,1,0.5,1),transform 1.8s cubic-bezier(0.22,1,0.36,1),border-radius 1.8s ease,opacity 1.4s ease-in-out}
#cam-song-card.fullscreen{clip-path:circle(85% at 50% 50%);opacity:1;transform:translate(0,0) scale(1);border-radius:0;border:none}
#cam-song-card.corner{clip-path:circle(100% at 50% 50%);opacity:1;transform:translate(45px,-45px) scale(0.28);border-radius:36px;border:12px solid #ffcc00;box-shadow:0 30px 90px rgba(0,0,0,0.95)}

#cam-wreath{position:absolute;inset:0;width:100%;height:100%;background-image:url('ramka_koleda.png.png');background-size:100% 100%;background-position:center;background-repeat:no-repeat;z-index:2;pointer-events:none}
.cam-badge{position:absolute;top:210px;left:50%;transform:translateX(-50%);z-index:6;font-family:'Rye',serif;font-size:44px;letter-spacing:5px;text-transform:uppercase;padding:8px 36px;border-top:3px solid #ffcc00;border-bottom:3px solid #ffcc00;background:linear-gradient(180deg,#ffe8b3 0%,#f4b942 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 5px 0px #3d0202) drop-shadow(0 8px 16px rgba(0,0,0,0.9));white-space:nowrap}
.cam-inner{position:relative;z-index:5;text-align:center;max-width:74%;margin-top:115px}
#cam-card-title{font-family:'Rye',serif;font-size:165px;line-height:1.05;margin-bottom:24px;background:repeating-linear-gradient(90deg,#fff3d6 0px,#fff3d6 22px,#ffd29d 22px,#ffd29d 30px);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 10px 0px #3d0202) drop-shadow(0 16px 28px rgba(0,0,0,0.95))}
#cam-card-artist{font-family:'Rye',serif;font-size:82px;letter-spacing:3px;background:linear-gradient(180deg,#ffe8b3 0%,#f4b942 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 7px 0px #3d0202) drop-shadow(0 12px 22px rgba(0,0,0,0.9))}

body.theme-gala #cam-song-card{background:radial-gradient(circle at center,#1d3557 0%,#0b1526 85%,#050a14 100%)}
body.theme-gala #cam-wreath{display:none}
body.theme-gala #cam-song-card::after{content:'';position:absolute;inset:35px;border:4px solid #d4af37;box-shadow:inset 0 0 0 12px #0b1526,inset 0 0 0 15px rgba(220,20,60,0.7);pointer-events:none}
body.theme-gala .cam-badge,body.theme-gala #cam-card-title,body.theme-gala #cam-card-artist{font-family:'Cinzel',serif;font-weight:900;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.9))}
body.theme-gala #cam-card-title{background:linear-gradient(180deg,#ffffff 0%,#e2e8f0 100%);-webkit-background-clip:text;background-clip:text}
body.theme-gala #cam-card-artist{background:linear-gradient(180deg,#fceabb 0%,#d4af37 100%);-webkit-background-clip:text;background-clip:text}
/* 4. PEŁNOEKRANOWA PLANSZA KOMUNIKATÓW NA NAGRANIU */
#cam-msg-bar{position:fixed;inset:0;z-index:48;background:radial-gradient(circle at center,#a81313 0%,#410303 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px;text-align:center;opacity:0;transform:scale(0.92);pointer-events:none;transition:transform 0.5s cubic-bezier(0.22,1,0.36,1),opacity 0.4s ease}
#cam-msg-bar::after{content:'';position:absolute;inset:32px;border:6px solid #ffcc00;border-radius:28px;box-shadow:0 0 40px rgba(255,204,0,0.4);pointer-events:none}
#cam-msg-bar.active{transform:scale(1);opacity:1}
.cam-msg-badge{font-size:32px;font-weight:900;letter-spacing:6px;text-transform:uppercase;color:#ffcc00;margin-bottom:28px;padding:10px 32px;border-top:3px solid #ffcc00;border-bottom:3px solid #ffcc00}
#cam-msg-text{font-size:110px;font-weight:900;line-height:1.15;color:#fff3d6;text-transform:uppercase;text-shadow:0 10px 0px #3d0202,0 18px 35px rgba(0,0,0,0.95);max-width:88vw;word-wrap:break-word}

body.theme-gala #cam-msg-bar{background:radial-gradient(circle at center,#1d3557 0%,#070f1c 100%)}
body.theme-gala #cam-msg-bar::after{border-color:#d4af37}
body.theme-gala .cam-msg-badge{color:#d4af37;border-color:#d4af37}
body.theme-gala #cam-msg-text{color:#ffffff;text-shadow:0 10px 0px #050a14}

body.theme-school #cam-msg-bar{background:radial-gradient(circle at center,#1e293b 0%,#020617 100%)}
body.theme-school #cam-msg-bar::after{border-color:#38bdf8}
body.theme-school .cam-msg-badge{color:#38bdf8;border-color:#38bdf8}
body.theme-school #cam-msg-text{color:#ffffff;text-shadow:0 10px 0px #020617}

/* 5. PEŁNOEKRANOWA PLANSZA ZEGARA NA NAGRANIU (100% KRYCIA) */
#cam-timer-pill{position:fixed;inset:0;z-index:49;background:radial-gradient(circle at center,#a81313 0%,#410303 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;transform:scale(0.92);pointer-events:none;transition:transform 0.5s cubic-bezier(0.22,1,0.36,1),opacity 0.4s ease}
#cam-timer-pill::after{content:'';position:absolute;inset:32px;border:6px solid #ffcc00;border-radius:28px;box-shadow:0 0 40px rgba(255,204,0,0.4);pointer-events:none}
#cam-timer-pill.active{transform:scale(1);opacity:1}
#cam-timer-label{font-size:36px;font-weight:900;letter-spacing:5px;text-transform:uppercase;color:#ffcc00;padding:12px 36px;border:3px solid #ffcc00;border-radius:50px;background:rgba(61,2,2,0.85);margin-bottom:28px;white-space:nowrap}
#cam-timer-digits{font-size:220px;font-weight:900;color:#fff3d6;font-variant-numeric:tabular-nums;text-shadow:0 12px 0px #3d0202,0 20px 45px rgba(0,0,0,0.95);line-height:1}

body.theme-gala #cam-timer-pill{background:radial-gradient(circle at center,#1d3557 0%,#070f1c 100%)}
body.theme-gala #cam-timer-pill::after{border-color:#d4af37}
body.theme-gala #cam-timer-label{background:rgba(11,21,38,0.92);border-color:#d4af37;color:#d4af37}
body.theme-gala #cam-timer-digits{color:#ffffff;text-shadow:0 12px 0px #050a14,0 20px 45px rgba(0,0,0,0.95)}

body.theme-school #cam-timer-pill{background:radial-gradient(circle at center,#1e293b 0%,#020617 100%)}
body.theme-school #cam-timer-pill::after{border-color:#38bdf8}
body.theme-school #cam-timer-label{background:rgba(15,23,42,0.92);border-color:#38bdf8;color:#38bdf8}
body.theme-school #cam-timer-digits{color:#ffffff;text-shadow:0 12px 0px #0f172a,0 20px 45px rgba(0,0,0,0.95)}

/* MOTYW SPORTOWY W BELKACH (BARWY SAMOCHODÓWKI: GRANAT + ŻÓŁTY) */
body.theme-sport #cam-ticker-wrap{background:linear-gradient(90deg,#0f1c30 0%,#1d3557 50%,#0f1c30 100%);border-color:#ffcc00}
body.theme-sport .ticker-badge{background:#ffcc00;color:#0f1c30;text-shadow:none}
body.theme-sport #cam-song-card{background:radial-gradient(circle at center,#182c4e 0%,#0c172b 85%,#060c17 100%)}
body.theme-sport #cam-wreath{display:none}
body.theme-sport #cam-song-card::after{content:'';position:absolute;inset:35px;border:5px solid #ffcc00;border-radius:24px;box-shadow:inset 0 0 30px rgba(255,204,0,0.22);pointer-events:none}
body.theme-sport .cam-badge,body.theme-sport #cam-card-title,body.theme-sport #cam-card-artist{font-family:'Montserrat',sans-serif;font-weight:900;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.95))}
body.theme-sport .cam-badge{border-color:#ffcc00;background:linear-gradient(180deg,#fff3b0 0%,#ffcc00 100%);-webkit-background-clip:text;background-clip:text}
body.theme-sport #cam-card-title{background:linear-gradient(180deg,#ffffff 0%,#e2e8f0 100%);-webkit-background-clip:text;background-clip:text}
body.theme-sport #cam-card-artist{background:linear-gradient(180deg,#ffe066 0%,#ffcc00 100%);-webkit-background-clip:text;background-clip:text}
body.theme-sport #cam-msg-bar{background:radial-gradient(circle at center,#182c4e 0%,#060c17 100%)}
body.theme-sport #cam-msg-bar::after{border-color:#ffcc00}
body.theme-sport .cam-msg-badge{color:#ffcc00;border-color:#ffcc00}
body.theme-sport #cam-msg-text{color:#ffffff;text-shadow:0 10px 0px #060c17}

/* PEŁNOEKRANOWY ZEGAR W SPORCIE (SAMOCHODÓWKA) */
body.theme-sport #cam-timer-pill{background:radial-gradient(circle at center,#182c4e 0%,#060c17 100%)}
body.theme-sport #cam-timer-pill::after{border-color:#ffcc00;box-shadow:0 0 40px rgba(255,204,0,0.45)}
body.theme-sport #cam-timer-label{background:rgba(11,22,43,0.92);border-color:#ffcc00;color:#ffcc00}
body.theme-sport #cam-timer-digits{color:#ffffff;text-shadow:0 12px 0px #060c17,0 20px 45px rgba(0,0,0,0.95)}

/* SCOREBOARD OBS NA NAGRANIU (DOKŁADNIE JAK ZE ZDJĘCIA) */
#cam-sb-wrapper{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-160px);z-index:25;display:flex;flex-direction:column;align-items:center;opacity:0;pointer-events:none;transition:transform 0.6s cubic-bezier(0.22,1,0.36,1),opacity 0.45s ease}
body.theme-sport #cam-sb-wrapper{transform:translateX(-50%) translateY(0);opacity:1}
#cam-sb-overlay{display:flex;align-items:center;background:rgba(20,35,60,0.94);border-radius:8px;border-bottom:3px solid #fc0;box-shadow:0 8px 24px rgba(0,0,0,0.55);overflow:hidden}
.cam-sb-team{display:flex;align-items:center;padding:10px 20px;min-width:230px;text-transform:uppercase;font-size:18px;font-weight:800;color:#fff}
.cam-sb-home{justify-content:flex-end}
.cam-sb-away{justify-content:flex-start}
.cam-sb-logo{width:40px;height:40px;object-fit:contain;margin:0 10px;display:none}
.cam-sb-score{font-size:32px;font-weight:900;background:rgba(0,0,0,0.45);padding:10px 25px;color:#fc0}
#cam-sb-timer{font-size:26px;font-weight:800;padding:0 30px;color:#fff;font-variant-numeric:tabular-nums}
#cam-sb-period{background:rgba(20,35,60,0.94);color:#fc0;font-size:15px;font-weight:900;padding:3px 14px;border-radius:0 0 6px 6px;border:2px solid #fc0;border-top:none;box-shadow:0 4px 10px rgba(0,0,0,0.4);margin-top:-1px}
/* MOTYW TYTANI WEJHEROWO NA NAGRANIU */
body.theme-tytani #cam-ticker-wrap{background:linear-gradient(90deg,#1a0305 0%,#8b0000 50%,#1a0305 100%);border-color:#ffcc00}
body.theme-tytani .ticker-badge{background:#ffcc00;color:#1a0305;text-shadow:none}
body.theme-tytani #cam-song-card{background:radial-gradient(circle at center,#8b0000 0%,#2b0303 80%,#09090b 100%)}
body.theme-tytani #cam-wreath{display:none}
body.theme-tytani #cam-song-card::after{content:'';position:absolute;inset:35px;border:5px solid #ffcc00;border-radius:24px;box-shadow:inset 0 0 30px rgba(255,204,0,0.25);pointer-events:none}
body.theme-tytani .cam-badge,body.theme-tytani #cam-card-title,body.theme-tytani #cam-card-artist{font-family:'Montserrat',sans-serif;font-weight:900;filter:drop-shadow(0 8px 18px rgba(0,0,0,0.95))}
body.theme-tytani .cam-badge{border-color:#ffcc00;background:linear-gradient(180deg,#fff3b0 0%,#ffcc00 100%);-webkit-background-clip:text;background-clip:text}
body.theme-tytani #cam-card-title{background:linear-gradient(180deg,#ffffff 0%,#f1f5f9 100%);-webkit-background-clip:text;background-clip:text}
body.theme-tytani #cam-card-artist{background:linear-gradient(180deg,#ffe066 0%,#ffcc00 100%);-webkit-background-clip:text;background-clip:text}
body.theme-tytani #cam-msg-bar{background:radial-gradient(circle at center,#8b0000 0%,#09090b 100%)}
body.theme-tytani #cam-msg-bar::after{border-color:#ffcc00}
body.theme-tytani .cam-msg-badge{color:#ffcc00;border-color:#ffcc00}
body.theme-tytani #cam-msg-text{color:#ffffff;text-shadow:0 10px 0px #1a0202}
body.theme-tytani #cam-timer-pill{background:radial-gradient(circle at center,#8b0000 0%,#09090b 100%)}
body.theme-tytani #cam-timer-pill::after{border-color:#ffcc00;box-shadow:0 0 40px rgba(255,204,0,0.45)}
body.theme-tytani #cam-timer-label{background:rgba(15,5,5,0.92);border-color:#ffcc00;color:#ffcc00}
body.theme-tytani #cam-timer-digits{color:#ffffff;text-shadow:0 12px 0px #1a0202,0 20px 45px rgba(0,0,0,0.95)}
body.theme-tytani #cam-sb-wrapper{transform:translateX(-50%) translateY(0);opacity:1}
body.theme-tytani #cam-sb-overlay{background:rgba(24,4,7,0.95);border-bottom:3px solid #ffcc00}
body.theme-tytani .cam-sb-score{background:rgba(139,0,0,0.65);color:#ffcc00}
body.theme-tytani #cam-sb-period{background:#1a0305;color:#ffcc00;border-color:#ffcc00}
</style>
</head>
<body>
<div id="cam-slide-full"><img id="cam-full-img" src="" alt=""></div>
<div id="cam-sb-wrapper">
    <div id="cam-sb-overlay">
        <div class="cam-sb-team cam-sb-home"><span id="sb-disp-home-name">GOSPODARZE</span><img class="cam-sb-logo" id="sb-disp-home-logo" src="" alt=""></div>
        <div id="sb-disp-home-score" class="cam-sb-score">0</div>
        <div id="cam-sb-timer">00:00</div>
        <div id="sb-disp-away-score" class="cam-sb-score">0</div>
        <div class="cam-sb-team cam-sb-away"><img class="cam-sb-logo" id="sb-disp-away-logo" src="" alt=""><span id="sb-disp-away-name">GOŚCIE</span></div>
    </div>
    <div id="cam-sb-period">POŁOWA 1</div>
</div>

<div id="cam-ticker-wrap">
    <div class="ticker-badge" id="ticker-badge-txt">🎄 NA ŻYWO</div>
    <div class="ticker-track">
        <div id="ticker-text"></div>
    </div>
</div>

<div id="cam-song-card">
    <div id="cam-wreath"></div>
    <div class="cam-badge" id="cam-badge-txt">Koncert kolęd</div>
    <div class="cam-inner">
        <div id="cam-card-title"></div>
        <div id="cam-card-artist"></div>
        <div id="cam-card-class" style="font-family:'Montserrat',sans-serif;font-style:italic;font-size:42px;color:#e2e8f0;margin-top:14px;letter-spacing:2px;text-shadow:0 4px 12px rgba(0,0,0,0.9)"></div>
    </div>
</div>
<div id="cam-msg-bar">
    <div class="cam-msg-badge">📢 KOMUNIKAT ORGANIZACYJNY</div>
    <div id="cam-msg-text">PRZERWA</div>
</div>

<div id="cam-timer-pill">
    <div id="cam-timer-label">CZAS DO KOŃCA</div>
    <div id="cam-timer-digits">05:00</div>
</div>
<script>
const TOPIC_PREFIX = "pzs4-wejherowo-av-2026/";
let songTimer1=null, tickerTimer=null, currentTheme='xmas';
let customBadgeText = "";
let camCountdownInterval = null;

function getDefaultBadge(){
    if(customBadgeText && customBadgeText.trim() !== '') return customBadgeText.trim();
    if(currentTheme === 'gala') return 'UROCZYSTOŚĆ PATRIOTYCZNA';
    if(currentTheme === 'school') return 'PZS NR 4 W WEJHEROWIE';
    if(currentTheme === 'sport') return 'ZAWODY SPORTOWE PZS 4';
    if(currentTheme === 'tytani') return 'KS TYTANI WEJHEROWO';
    return 'Koncert kolęd';
}

function setTheme(theme){
    currentTheme = theme;
    document.body.classList.remove('theme-gala', 'theme-school', 'theme-sport', 'theme-tytani');
    if(theme === 'gala'){
        document.body.classList.add('theme-gala');
        document.getElementById('ticker-badge-txt').innerText = '🇵🇱 PZS 4 WEJHEROWO';
    } else if(theme === 'school'){
        document.body.classList.add('theme-school');
        document.getElementById('ticker-badge-txt').innerText = '🎓 PZS 4 WEJHEROWO';
    } else if(theme === 'sport'){
        document.body.classList.add('theme-sport');
        document.getElementById('ticker-badge-txt').innerText = '⚽ SPORT NA ŻYWO';
    } else if(theme === 'tytani'){
        document.body.classList.add('theme-tytani');
        document.getElementById('ticker-badge-txt').innerText = '🛡️ KS TYTANI WEJHEROWO';
    } else {
        document.getElementById('ticker-badge-txt').innerText = '🎄 NA ŻYWO';
    }
    document.getElementById('cam-badge-txt').innerText = getDefaultBadge();
}

function showCamSong(title, artist, cls, badge){
    hideCamSpeaker();
    document.getElementById('cam-badge-txt').innerText = badge || getDefaultBadge();

    const titleEl=document.getElementById('cam-card-title');
    const artistEl=document.getElementById('cam-card-artist');
    const classEl=document.getElementById('cam-card-class');

    titleEl.innerText=title;
    if(title.length <= 12) titleEl.style.fontSize = '175px';
    else if(title.length <= 20) titleEl.style.fontSize = '130px';
    else if(title.length <= 28) titleEl.style.fontSize = '104px';
    else titleEl.style.fontSize = '82px';

    artistEl.innerText=artist;
    if(artist.length <= 22) artistEl.style.fontSize = '80px';
    else if(artist.length <= 35) artistEl.style.fontSize = '58px';
    else artistEl.style.fontSize = '44px';

    classEl.innerText=cls||'';
    classEl.style.display=cls?'block':'none';

    const card=document.getElementById('cam-song-card');
    clearTimeout(songTimer1);

    card.classList.remove('corner');
    card.classList.add('fullscreen');
    songTimer1=setTimeout(()=>{
        card.classList.remove('fullscreen');
        card.classList.add('corner');
    },5500);
}

function showCamSpeaker(name, role){
    clearTimeout(songTimer1);
    clearTimeout(tickerTimer);
    document.getElementById('cam-song-card').classList.remove('fullscreen','corner');

    const wrap=document.getElementById('cam-ticker-wrap');
    const txt=document.getElementById('ticker-text');
    const icon = currentTheme === 'gala' ? '🔸' : '⭐';
    txt.innerText = role ? `${icon} ${name}  —  ${role} ${icon}` : `${icon} ${name} ${icon}`;
    
    txt.style.animation='none';
    txt.offsetHeight;
    wrap.classList.add('active');
    
    setTimeout(()=>{ txt.style.animation='marqueePass 9s linear 2'; },1200);
    tickerTimer=setTimeout(()=>{ wrap.classList.remove('active'); },19500);
}

function hideCamSpeaker(){
    clearTimeout(tickerTimer);
    document.getElementById('cam-ticker-wrap').classList.remove('active');
}

function showCamSlide(dataUrl){
    if(!dataUrl) return;
    document.getElementById('cam-full-img').src=dataUrl;
    document.getElementById('cam-slide-full').classList.add('active');
}

function hideCamSlide(){
    document.getElementById('cam-slide-full').classList.remove('active');
}

function runCamCountdown(endTime, label){
    clearInterval(camCountdownInterval);
    const pill = document.getElementById('cam-timer-pill');
    const lbl = document.getElementById('cam-timer-label');
    const dig = document.getElementById('cam-timer-digits');
    lbl.innerText = label || "ODLICZANIE";
    pill.classList.add('active');

    const tick = () => {
        const diff = endTime - Date.now();
        if(diff <= 0){
            clearInterval(camCountdownInterval);
            dig.innerText = "KONIEC!";
            setTimeout(() => stopCamCountdown(), 3000);
            return;
        }
        const totalSec = Math.ceil(diff / 1000);
        const mm = String(Math.floor(totalSec / 60)).padStart(2, '0');
        const ss = String(totalSec % 60).padStart(2, '0');
        dig.innerText = `${mm}:${ss}`;
    };
    tick();
    camCountdownInterval = setInterval(tick, 250);
}

function stopCamCountdown(){
    clearInterval(camCountdownInterval);
    document.getElementById('cam-timer-pill').classList.remove('active');
}

function renderCamScoreboard(st){
    if(!st) return;
    document.getElementById('sb-disp-home-name').innerText = st.homeName || "GOSPODARZE";
    document.getElementById('sb-disp-away-name').innerText = st.awayName || "GOŚCIE";
    const hL = document.getElementById('sb-disp-home-logo');
    if(st.homeLogo){ hL.src = st.homeLogo; hL.style.display = "block"; } else { hL.style.display = "none"; }
    const aL = document.getElementById('sb-disp-away-logo');
    if(st.awayLogo){ aL.src = st.awayLogo; aL.style.display = "block"; } else { aL.style.display = "none"; }
    document.getElementById('sb-disp-home-score').innerText = st.homeScore ?? 0;
    document.getElementById('sb-disp-away-score').innerText = st.awayScore ?? 0;
    document.getElementById('cam-sb-period').innerText = st.period || 1;
    const m = Math.floor((st.time || 0) / 60).toString().padStart(2, '0');
    const s = ((st.time || 0) % 60).toString().padStart(2, '0');
    document.getElementById('cam-sb-timer').innerText = `${m}:${s}`;
}

const mqttLib = document.createElement('script');
mqttLib.src = "mqtt.min.js";
mqttLib.onload = () => {
    const brokerUrl = ["wss", "://", "broker", ".", "hivemq", ".", "com", ":8884/mqtt"].join("");
    const client = mqtt.connect(brokerUrl, {
        reconnectPeriod: 2000,
        keepalive: 30
    });

    client.on("connect", () => {
        client.subscribe(TOPIC_PREFIX + "belki");
        client.subscribe(TOPIC_PREFIX + "theme");
        client.subscribe(TOPIC_PREFIX + "custombadge");
        client.subscribe(TOPIC_PREFIX + "msg");
        client.subscribe(TOPIC_PREFIX + "timer");
        client.subscribe(TOPIC_PREFIX + "scoreboard");
    });

    client.on("message", (topic, message) => {
        try {
            const d = JSON.parse(message.toString());
            if (topic === TOPIC_PREFIX + "theme" || d.action === 'setTheme') setTheme(d.theme);
            if (topic === TOPIC_PREFIX + "scoreboard" && d.state) renderCamScoreboard(d.state);
            if (topic === TOPIC_PREFIX + "msg") {
    const bar = document.getElementById('cam-msg-bar');
    const txt = document.getElementById('cam-msg-text');
    if (d.action === 'show' && d.text) {
        const cleanTxt = d.text.trim();
        txt.innerText = cleanTxt;
        if (cleanTxt.length <= 18) txt.style.fontSize = '135px';
        else if (cleanTxt.length <= 35) txt.style.fontSize = '100px';
        else txt.style.fontSize = '75px';
        bar.classList.add('active');
    } else {
        bar.classList.remove('active');
    }
}
if (topic === TOPIC_PREFIX + "timer") {
    if (d.action === 'start' && d.durationSec) {
        runCamCountdown(Date.now() + (d.durationSec * 1000), d.label);
    } else {
        stopCamCountdown();
    }
}
            if (d.action === 'show') showCamSong(d.title, d.artist, d.cls, d.badge);
            if (d.action === 'hide') { clearTimeout(songTimer1); document.getElementById('cam-song-card').classList.remove('fullscreen','corner'); }
            if (d.action === 'showSpeaker') showCamSpeaker(d.name, d.role);
            if (d.action === 'hideSpeaker') hideCamSpeaker();
            if (d.action === 'showCamSlide') showCamSlide(d.img);
            if (d.action === 'hideCamSlide') hideCamSlide();
            if (topic === TOPIC_PREFIX + "custombadge") {
    customBadgeText = d.text || "";
    document.getElementById('cam-badge-txt').innerText = getDefaultBadge();
}
        } catch (e) { console.error(e); }
    });
};
document.head.appendChild(mqttLib);
</script>
