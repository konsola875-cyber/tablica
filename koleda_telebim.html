<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PZS 4 AV - Kolędowanie Telebim</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#050b14;overflow:hidden;color:#fff;width:100vw;height:100vh}
#scene-wrap{position:relative;width:100vw;height:100vh;overflow:hidden}
#bg-photo{position:absolute;inset:0;background:url('tlo_koleda.jpg') center/cover no-repeat;z-index:1}

/* Maska przycinająca śnieg wyłącznie do obszaru dwóch wielkich okien */
#window-snow{position:absolute;top:11%;left:30%;width:54%;height:54%;clip-path:polygon(0% 100%, 0% 35%, 18% 6%, 46% 0%, 54% 0%, 82% 6%, 100% 35%, 100% 100%);z-index:2;pointer-events:none}

/* Ciepły, pulsacyjny blask ognia w kominku (lewy dolny róg) */
#fire-glow{position:absolute;left:2%;bottom:14%;width:24%;height:34%;background:radial-gradient(circle,rgba(255,140,20,0.45) 0%,rgba(255,60,0,0.15) 55%,transparent 75%);z-index:3;pointer-events:none;mix-blend-mode:screen;animation:firePulse 0.18s infinite alternate}
@keyframes firePulse{0%{transform:scale(0.97) translateY(2px);opacity:0.75}100%{transform:scale(1.04) translateY(-2px);opacity:1}}

/* Migotanie lampek na choince za oknem i na suficie */
#lights-twinkle{position:absolute;top:15%;left:34%;width:22%;height:42%;background:radial-gradient(circle,rgba(255,220,100,0.22),transparent 70%);z-index:3;pointer-events:none;mix-blend-mode:screen;animation:twinkle 2.2s infinite alternate ease-in-out}
@keyframes twinkle{0%{opacity:0.35;transform:scale(0.95)}100%{opacity:0.95;transform:scale(1.05)}}

/* Canvas na iskry w kominku oraz parę z obu kubków z herbatą */
#fx-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none}

/* KARTA ZAPOWIEDZI KOLĘDY */
#song-card{position:absolute;top:50%;left:50%;z-index:30;background:rgba(12,20,36,.92);backdrop-filter:blur(10px);border:2px solid #ffcc00;border-radius:16px;padding:45px 75px;text-align:center;box-shadow:0 25px 70px rgba(0,0,0,.9);opacity:0;transform:translate(-50%,-45%) scale(0.9);transition:all 0.75s cubic-bezier(0.16,1,0.3,1);pointer-events:none;max-width:80%}
#song-card.active{opacity:1;transform:translate(-50%,-50%) scale(1)}
.song-badge{display:inline-block;background:#c1121f;color:#fff;font-size:15px;font-weight:700;padding:6px 18px;border-radius:20px;letter-spacing:2px;text-transform:uppercase;margin-bottom:16px}
#card-title{font-size:56px;color:#ffcc00;font-weight:800;margin-bottom:12px;text-shadow:0 4px 15px rgba(0,0,0,0.6)}
#card-artist{font-size:30px;color:#f1f5f9;font-weight:600;letter-spacing:1px}

/* PILOT STEROWANIA (?pilot=1) */
#pilot-panel{display:none;position:fixed;inset:0;background:#121722;z-index:5000;padding:20px;overflow-y:auto}
.p-box{background:#1b2232;border-radius:10px;padding:16px;margin-bottom:16px;border:1px solid #2d3850}
.p-box h3{color:#ffcc00;margin-bottom:12px;font-size:18px}
input,textarea{width:100%;padding:10px;border-radius:6px;border:1px solid #44526e;background:#0d111a;color:#fff;font-size:16px;margin-bottom:10px}
.btn{padding:12px 18px;border:none;border-radius:6px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;margin:3px}
.btn-gold{background:#ffcc00;color:#111}.btn-green{background:#00a859}.btn-red{background:#d62828}.btn-blue{background:#0066ff}
.song-item{display:flex;justify-content:space-between;align-items:center;background:#131824;padding:10px 14px;border-radius:6px;margin-bottom:8px;border-left:4px solid #ffcc00}
#conn-badge{display:inline-block;padding:5px 12px;border-radius:5px;font-size:13px;font-weight:700;background:#d62828;margin-bottom:12px}
</style>
</head>
<body>
<div id="scene-wrap">
    <div id="bg-photo"></div>
    <canvas id="window-snow"></canvas>
    <div id="fire-glow"></div>
    <div id="lights-twinkle"></div>
    <canvas id="fx-canvas"></canvas>
</div>

<div id="song-card">
    <div class="song-badge">🎄 TERAZ NA SCENIE</div>
    <div id="card-title">Cicha noc</div>
    <div id="card-artist">Samochodówka Band</div>
</div>

<div id="pilot-panel">
    <div style="text-align:center">
        <h2 style="color:#ffcc00;margin-bottom:6px">🎄 PILOT KOLĘDOWANIA - PZS 4 AV</h2>
        <div id="conn-badge">🔴 ŁĄCZENIE Z TELEBIMEM...</div>
    </div>
    <div class="p-box">
        <h3>⚡ SZYBKA ZAPOWIEDŹ (TRYB RĘCZNY)</h3>
        <input type="text" id="in-title" placeholder="Wpisz tytuł kolędy lub piosenki...">
        <input type="text" id="in-artist" placeholder="Wykonawca (np. Samochodówka Band)...">
        <div style="margin-bottom:10px">
            <button class="btn btn-blue" onclick="document.getElementById('in-artist').value='Samochodówka Band'">🎸 Samochodówka Band</button>
            <button class="btn btn-blue" onclick="document.getElementById('in-artist').value='Wspólne śpiewanie'">🎤 Wspólne śpiewanie</button>
        </div>
        <button class="btn btn-gold" onclick="triggerManual(false)">🎄 POKAŻ ZAPOWIEDŹ (8s)</button>
        <button class="btn btn-green" onclick="triggerManual(true)">📌 PRZYPNIJ NA STAŁE</button>
        <button class="btn btn-red" onclick="hideCardNow()">✖ UKRYJ KARTĘ</button>
    </div>
    <div class="p-box">
        <h3>📋 GOTOWA LISTA UTWORÓW</h3>
        <textarea id="playlist-raw" rows="4" placeholder="Wzór: Cicha noc | Samochodówka Band"></textarea>
        <button class="btn btn-blue" onclick="buildPlaylist()">🔄 ZAŁADUJ LISTĘ</button>
        <div id="playlist-buttons" style="margin-top:12px"></div>
    </div>
</div>
<script>
const HOST_ID="pzs4-wejherowo-koleda-telebim-2026";
const BELKI_ID="pzs4-wejherowo-koleda-belki-2026";
const isPilotMode = new URLSearchParams(window.location.search).get('pilot') === '1';
let peer=null,connTelebim=null,connBelki=null,hideTimeout=null;

// 1. ŚNIEG PADĄCY WYŁĄCZNIE ZA OKNAMI
const sCvs=document.getElementById('window-snow'),sCtx=sCvs.getContext('2d');
let flakes=new Array();

// 2. ISKRY W KOMINKU + DYM ZE ŚWIEC + PARA Z KUBKÓW HERBATY
const fCvs=document.getElementById('fx-canvas'),fCtx=fCvs.getContext('2d');
let embers=new Array(), steam=new Array();

function initFX(){
    sCvs.width=sCvs.offsetWidth; sCvs.height=sCvs.offsetHeight;
    fCvs.width=window.innerWidth; fCvs.height=window.innerHeight;
    flakes=new Array();
    for(let i=0;i<90;i++){
        flakes.push({
            x:Math.random()*sCvs.width, y:Math.random()*sCvs.height,
            size:Math.random()*6+3.5, speed:Math.random()*0.9+0.4,
            drift:Math.random()*0.5-0.25, angle:Math.random()*6.28, spin:(Math.random()-0.5)*0.02,
            alpha:Math.random()*0.55+0.35
        });
    }
}

function drawCrystal(ctx,x,y,size,angle,alpha){
    ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
    ctx.strokeStyle=`rgba(255,255,255,${alpha})`; ctx.lineWidth=1.2;
    ctx.beginPath();
    for(let i=0;i<6;i++){
        ctx.rotate(Math.PI/3);
        ctx.moveTo(0,0); ctx.lineTo(0,size);
        ctx.moveTo(0,size*0.55); ctx.lineTo(size*0.3,size*0.8);
        ctx.moveTo(0,size*0.55); ctx.lineTo(-size*0.3,size*0.8);
    }
    ctx.stroke(); ctx.restore();
}

function animateScene(){
    if(!isPilotMode){
        // Rysowanie śnieżynek za oknem
        sCtx.clearRect(0,0,sCvs.width,sCvs.height);
        flakes.forEach(f=>{
            drawCrystal(sCtx,f.x,f.y,f.size,f.angle,f.alpha);
            f.y+=f.speed; f.x+=f.drift; f.angle+=f.spin;
            if(f.y>sCvs.height+15){f.y=-15; f.x=Math.random()*sCvs.width}
        });

        // Rysowanie ognia, iskier i pary
        fCtx.clearRect(0,0,fCvs.width,fCvs.height);
        const W=fCvs.width, H=fCvs.height;

        // Generowanie iskier i płomieni w kominku (lewy dół: X ~ 11%, Y ~ 74%)
        if(embers.length<45){
            embers.push({
                x: W*(0.08 + Math.random()*0.07),
                y: H*(0.72 + Math.random()*0.05),
                vx: (Math.random()-0.5)*0.8,
                vy: -(Math.random()*1.8+0.8),
                r: Math.random()*4+2,
                life: 1,
                isFlame: Math.random()>0.45
            });
        }
        embers.forEach((e,idx)=>{
            fCtx.save();
            fCtx.globalAlpha=e.life;
            if(e.isFlame){
                const g=fCtx.createRadialGradient(e.x,e.y,1,e.x,e.y,e.r*4);
                g.addColorStop(0,"rgba(255,230,100,0.9)");
                g.addColorStop(0.5,"rgba(255,100,0,0.5)");
                g.addColorStop(1,"transparent");
                fCtx.fillStyle=g;
                fCtx.beginPath(); fCtx.arc(e.x,e.y,e.r*4,0,6.28); fCtx.fill();
            } else {
                fCtx.fillStyle="#ffdd55";
                fCtx.beginPath(); fCtx.arc(e.x,e.y,e.r*0.6,0,6.28); fCtx.fill();
            }
            fCtx.restore();
            e.x+=e.vx; e.y+=e.vy; e.life-=0.022;
            if(e.life<=0) embers.splice(idx,1);
        });

        // Generowanie pary z dwóch kubków herbaty na stole (X ~ 63% i 70%, Y ~ 71%) oraz dymu ze świec (X ~ 56% i 60%, Y ~ 62%)
        if(Math.random()<0.25){
            const sources=[
                {x:W*0.635, y:H*0.71}, // Kubek lewy
                {x:W*0.705, y:H*0.71}, // Kubek prawy
                {x:W*0.565, y:H*0.61}, // Świeca 1
                {x:W*0.595, y:H*0.63}  // Świeca 2
            ];
            const src=sources.at(Math.floor(Math.random()*sources.length));
            steam.push({
                x: src.x + (Math.random()-0.5)*8,
                y: src.y,
                vx: (Math.random()-0.5)*0.4,
                vy: -(Math.random()*0.7+0.35),
                r: Math.random()*8+6,
                life: 0.45
            });
        }
        steam.forEach((s,idx)=>{
            fCtx.save();
            const g=fCtx.createRadialGradient(s.x,s.y,1,s.x,s.y,s.r);
            g.addColorStop(0,`rgba(255,255,255,${s.life})`);
            g.addColorStop(1,"transparent");
            fCtx.fillStyle=g;
            fCtx.beginPath(); fCtx.arc(s.x,s.y,s.r,0,6.28); fCtx.fill();
            fCtx.restore();
            s.x+=s.vx + Math.sin(s.y*0.05)*0.3;
            s.y+=s.vy; s.r+=0.15; s.life-=0.0045;
            if(s.life<=0) steam.splice(idx,1);
        });
    }
    requestAnimationFrame(animateScene);
}
window.addEventListener('resize',initFX); initFX(); animateScene();

function displayCard(title,artist,pin){
    const card=document.getElementById('song-card');
    document.getElementById('card-title').innerText=title;
    document.getElementById('card-artist').innerText=artist;
    card.classList.add('active');
    clearTimeout(hideTimeout);
    if(!pin) hideTimeout=setTimeout(()=>card.classList.remove('active'),8000);
}

function initHost(){
    peer=new Peer(HOST_ID);
    peer.on('connection',c=>{
        c.on('data',d=>{
            if(d.action==='show') displayCard(d.title,d.artist,d.pin);
            if(d.action==='hide'){clearTimeout(hideTimeout);document.getElementById('song-card').classList.remove('active')}
        });
    });
}

function connectPilot(){
    const b=document.getElementById('conn-badge');
    b.style.background='#d62828';b.innerText='🔴 ŁĄCZENIE Z TELEBIMEM...';
    connTelebim=peer.connect(HOST_ID,{reliable:true});
    connTelebim.on('open',()=>{b.style.background='#00a859';b.innerText='🟢 POŁĄCZONO Z TELEBIMEM'});
    connTelebim.on('close',()=>{b.style.background='#d62828';b.innerText='🔴 ROZŁĄCZONO - PONAWIAM...';setTimeout(connectPilot,2000)});
    connBelki=peer.connect(BELKI_ID,{reliable:true});
}

function sendSong(title,artist,pin){
    const payload={action:'show',title:title,artist:artist,pin:pin};
    if(connTelebim&&connTelebim.open) connTelebim.send(payload);
    if(connBelki&&connBelki.open) connBelki.send(payload);
}

function triggerManual(pin){
    const t=document.getElementById('in-title').value.trim();
    const a=document.getElementById('in-artist').value.trim()||"Samochodówka Band";
    if(!t)return alert("Wpisz tytuł kolędy!");
    sendSong(t,a,pin);
    document.getElementById('in-title').value='';
}

function hideCardNow(){
    if(connTelebim&&connTelebim.open) connTelebim.send({action:'hide'});
    if(connBelki&&connBelki.open) connBelki.send({action:'hide'});
}

function buildPlaylist(){
    const raw=document.getElementById('playlist-raw').value.trim();
    const box=document.getElementById('playlist-buttons');
    box.innerHTML='';
    if(!raw)return;
    raw.split('\n').forEach(line=>{
        const parts=line.split('|');
        const t=(parts.at(0)||'').trim();
        const a=(parts.at(1)||'Samochodówka Band').trim();
        if(t){
            const row=document.createElement('div');row.className='song-item';
            row.innerHTML=`<div><strong style="color:#ffcc00">${t}</strong><br><small style="color:#aaa">${a}</small></div>
            <div><button class="btn btn-gold" onclick="sendSong('${t.replace(/'/g,"\\'")}','${a.replace(/'/g,"\\'")}',false)">▶️ 8s</button>
            <button class="btn btn-green" onclick="sendSong('${t.replace(/'/g,"\\'")}','${a.replace(/'/g,"\\'")}',true)">📌</button></div>`;
            box.appendChild(row);
        }
    });
}

const lib=document.createElement('script');
lib.src="https:"+"//unpkg.com"+"/peerjs@1.5.4"+"/dist/peerjs.min.js";
lib.onload=()=>{
    if(isPilotMode){
        document.getElementById('pilot-panel').style.display='block';
        peer=new Peer();
        peer.on('open',()=>connectPilot());
    }else{
        initHost();
    }
};
document.head.appendChild(lib);
</script>
</body>
</html>
