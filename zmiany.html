<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PZS 4 AV - Zmiany</title>
<style>
body{margin:0;font-family:sans-serif;background:transparent;overflow:hidden;color:#fff;font-weight:700}
#wrapper{padding:15px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateX(-110%);transition:transform 0.45s cubic-bezier(0.22,1,0.36,1),opacity 0.35s ease}
#wrapper.active{opacity:1;transform:translateX(0)}
#sub-badge{background:#fc0;color:#14233c;font-size:12px;padding:4px 12px;border-radius:4px;letter-spacing:1.5px;width:fit-content;text-align:center;text-transform:uppercase;box-shadow:0 2px 6px rgba(0,0,0,.4)}
#sub-box{background:rgba(20,35,60,.95);border-left:5px solid #fc0;border-bottom:2px solid #fc0;border-radius:6px;padding:10px 16px;box-shadow:0 4px 12px rgba(0,0,0,.5);width:fit-content}
.sub-header{font-size:12px;color:#fc0;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.sub-row{display:flex;align-items:center;gap:12px;font-size:16px}
.sub-out,.sub-in{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:4px}
.sub-out{background:#f33}
.sub-in{background:#0a5}
.sub-label{font-size:11px;letter-spacing:0.5px;opacity:0.95}
.sub-num{font-size:19px}
</style>
</head>
<body>
<div id="wrapper">
<div id="sub-badge">ZMIANA</div>
<div id="sub-box">
<div class="sub-header" id="sub-team">DRUŻYNA</div>
<div class="sub-row">
<span class="sub-out">▼ <span class="sub-label">SCHODZI</span> <span class="sub-num" id="num-out">0</span></span>
<span class="sub-in">▲ <span class="sub-label">WCHODZI</span> <span class="sub-num" id="num-in">0</span></span>
</div>
</div>
</div>
<script>
const ZMIANY_ID="pzs4-wejherowo-zmiany-host-2026";
let hideTimer=null;
function showSub(data){
const wrap=document.getElementById('wrapper');
document.getElementById('sub-team').innerText=data.team;
document.getElementById('num-out').innerText=data.outNum;
document.getElementById('num-in').innerText=data.inNum;
wrap.classList.add('active');
clearTimeout(hideTimer);
hideTimer=setTimeout(()=>{wrap.classList.remove('active')},12000);
}
const lib=document.createElement('script');
lib.src="https:"+"//unpkg.com"+"/peerjs@1.5.4"+"/dist/peerjs.min.js";
lib.onload=()=>{const p=new Peer(ZMIANY_ID);p.on('connection',c=>c.on('data',d=>{if(d&&d.type==='sub')showSub(d)}))};
document.head.appendChild(lib);
</script>
</body>
</html>
