<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PZS 4 AV - Zmiany</title>
<style>
body{margin:0;font-family:sans-serif;background:transparent;overflow:hidden;color:#fff;font-weight:700}
#sub-box{display:none;margin:15px;background:rgba(20,35,60,.95);border-left:5px solid #fc0;border-bottom:2px solid #fc0;border-radius:6px;padding:10px 18px;box-shadow:0 4px 12px rgba(0,0,0,.5);width:fit-content;animation:slideIn .3s ease-out}
.sub-header{font-size:11px;color:#fc0;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.sub-row{display:flex;align-items:center;gap:14px;font-size:18px}
.sub-out{background:#f33;padding:4px 10px;border-radius:4px}
.sub-in{background:#0a5;padding:4px 10px;border-radius:4px}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}
</style>
</head>
<body>
<div id="sub-box">
<div class="sub-header" id="sub-team">ZMIANA</div>
<div class="sub-row">
<span class="sub-out">▼ <span id="num-out">0</span></span>
<span class="sub-in">▲ <span id="num-in">0</span></span>
</div>
</div>
<script>
const ZMIANY_ID="pzs4-wejherowo-zmiany-host-2026";
let hideTimer=null;
function showSub(data){
const box=document.getElementById('sub-box');
document.getElementById('sub-team').innerText="ZMIANA: "+data.team;
document.getElementById('num-out').innerText=data.outNum;
document.getElementById('num-in').innerText=data.inNum;
box.style.display='block';
clearTimeout(hideTimer);
hideTimer=setTimeout(()=>{box.style.display='none'},10000);
}
const lib=document.createElement('script');
lib.src="https:"+"//unpkg.com"+"/peerjs@1.5.4"+"/dist/peerjs.min.js";
lib.onload=()=>{const p=new Peer(ZMIANY_ID);p.on('connection',c=>c.on('data',d=>{if(d&&d.type==='sub')showSub(d)}))};
document.head.appendChild(lib);
</script>
</body>
</html>
