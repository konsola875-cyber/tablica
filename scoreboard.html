<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>PZS 4 AV - Scoreboard</title>
<style>
:root{--bg:rgba(20,35,60,.92);--blue:#05f;--yel:#fc0;--pan:#1e1e2f}
body{margin:0;font-family:sans-serif;background:transparent;overflow:hidden;color:#fff;font-weight:700}
#obs-wrapper{position:absolute;top:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
#obs-overlay{display:flex;align-items:center;background:var(--bg);border-radius:8px;border-bottom:3px solid var(--yel);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.obs-team{display:flex;align-items:center;padding:10px 20px;min-width:230px;text-transform:uppercase;font-size:18px}
.home{justify-content:flex-end}.away{justify-content:flex-start}
.obs-logo{width:40px;height:40px;object-fit:contain;margin:0 10px;display:none}
.obs-score{font-size:32px;background:rgba(0,0,0,.4);padding:10px 25px;color:var(--yel)}
#obs-timer{font-size:26px;padding:0 30px}
#obs-period{background:var(--bg);color:var(--yel);font-size:15px;padding:3px 14px;border-radius:0 0 6px 6px;border:2px solid var(--yel);border-top:none;box-shadow:0 4px 10px rgba(0,0,0,.4);margin-top:-1px}
#open-control-btn{position:absolute;top:20px;left:20px;background:rgba(0,0,0,.6);color:#fff;border:1px solid #fff;padding:10px 18px;border-radius:4px;cursor:pointer;z-index:9999;font-size:15px}
#control-panel{display:none;background:var(--pan);padding:20px;width:100vw;height:100vh;box-sizing:border-box;position:absolute;top:0;left:0;z-index:1000;overflow-y:auto}
.panel-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:15px}
.section{background:rgba(255,255,255,.05);padding:15px;border-radius:8px;text-align:center}
button.control-btn{background:var(--blue);color:#fff;border:none;padding:10px 18px;font-size:15px;border-radius:5px;cursor:pointer;margin:4px;font-weight:700}
button.btn-danger{background:#f33}button.btn-success{background:#0a5}button.btn-warning{background:#f90}
input,select{padding:8px;font-size:16px;border-radius:4px;border:1px solid #555;background:#333;color:#fff;margin:4px}
.cfg-input{width:42%}.small-input{width:65px;text-align:center}
#active-penalties-list{margin-top:10px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.pen-tag{background:#f33;padding:5px 10px;border-radius:4px;font-size:14px;display:flex;align-items:center;gap:8px}
#conn-status{display:inline-block;padding:4px 12px;border-radius:4px;font-size:14px;margin-bottom:10px;background:#f33}
</style>
</head>
<body>
<button id="open-control-btn" onclick="openPilot()">🎛️ OTWÓRZ PILOTA</button>
<div id="obs-wrapper">
<div id="obs-overlay">
<div class="obs-team home"><span id="display-home-name">GOSPODARZE</span><img class="obs-logo" id="display-home-logo" src="" alt=""></div>
<div id="display-home-score" class="obs-score">0</div>
<div id="obs-timer">00:00</div>
<div id="display-away-score" class="obs-score">0</div>
<div class="obs-team away"><img class="obs-logo" id="display-away-logo" src="" alt=""><span id="display-away-name">GOŚCIE</span></div>
</div>
<div id="obs-period">1</div>
</div>
<div id="control-panel">
<div style="text-align:center"><h2 style="color:var(--yel);margin:0 0 8px 0">🎛️ PANEL TABLICY - PZS 4 AV</h2><div id="conn-status">🔴 ŁĄCZENIE Z OBS...</div></div>
<div class="section">
<h3>🛠️ KONFIGURACJA MECZU</h3>
<input type="text" id="input-home-name" class="cfg-input" placeholder="Gospodarze" oninput="updateSettings()">
<input type="text" id="input-home-logo" class="cfg-input" placeholder="Logo Gospodarzy (URL)" oninput="updateSettings()"><br>
<input type="text" id="input-away-name" class="cfg-input" placeholder="Goście" oninput="updateSettings()">
<input type="text" id="input-away-logo" class="cfg-input" placeholder="Logo Gości (URL)" oninput="updateSettings()">
<br><button class="control-btn btn-warning" onclick="swapSides()">⇄ ZAMIEŃ DRUŻYNY STRONAMI</button>
</div>
<div class="panel-grid">
<div class="section"><h3 id="panel-home-title">GOSPODARZE</h3><button class="control-btn" onclick="changeScore('home',1)">+1 Punkt</button><button class="control-btn btn-danger" onclick="changeScore('home',-1)">-1</button></div>
<div class="section"><h3 id="panel-away-title">GOŚCIE</h3><button class="control-btn" onclick="changeScore('away',1)">+1 Punkt</button><button class="control-btn btn-danger" onclick="changeScore('away',-1)">-1</button></div>
</div>
<div class="section" style="margin-top:15px">
<h3>⏱️ CZAS I POŁOWA</h3>
Auto-stop: <input type="number" id="input-target-time" class="small-input" value="12" onchange="updateSettings()"> min | 
Połowa: <button class="control-btn" style="padding:6px 12px" onclick="changePeriod(-1)">-</button> <span id="panel-period-val" style="font-size:20px;color:var(--yel);margin:0 5px">1</span> <button class="control-btn" style="padding:6px 12px" onclick="changePeriod(1)">+</button><br>
<button class="control-btn btn-success" onclick="toggleTimer()">START / PAUZA</button>
<button class="control-btn btn-warning" onclick="resetTimerOnly()">RESET CZASU</button>
<button class="control-btn btn-danger" onclick="resetAll()">RESET MECZU</button>
</div>
<div class="section" style="margin-top:15px;border:1px solid #f33">
<h3 style="color:#f33;margin-top:0">🟥 KARY CZASOWE</h3>
Drużyna: <select id="pen-team"><option value="home" id="opt-home">GOSPODARZE</option><option value="away" id="opt-away">GOŚCIE</option></select>
Nr: <input type="number" id="pen-num" class="small-input" placeholder="Nr">
Min: <input type="number" id="pen-mins" class="small-input" value="2">
<button class="control-btn btn-danger" onclick="addPenalty()">DODAJ KARĘ</button>
<div id="active-penalties-list"></div>
</div>
<div class="section" style="margin-top:15px;border:1px solid #0a5">
<h3 style="color:#0a5;margin-top:0">🔄 ZMIANA ZAWODNIKÓW</h3>
Drużyna: <select id="sub-team-sel"><option value="home" id="sub-opt-home">GOSPODARZE</option><option value="away" id="sub-opt-away">GOŚCIE</option></select>
Schodzi: <input type="number" id="sub-out-num" class="small-input" placeholder="Nr">
Wchodzi: <input type="number" id="sub-in-num" class="small-input" placeholder="Nr">
<button class="control-btn btn-success" onclick="sendSub()">POKAŻ ZMIANĘ</button>
</div>
</div>
<script>
const OBS_ID="pzs4-wejherowo-obs-host-2026";
let peer=null,conn=null,connKary=null,connZmiany=null,isPilot=false,timer=null,isRunning=false,activePilots=new Array();
let state=JSON.parse(localStorage.getItem('pzs4_state'))||{homeName:"GOSPODARZE",awayName:"GOŚCIE",homeLogo:"",awayLogo:"",homeScore:0,awayScore:0,time:0,targetTime:12,period:1,penalties:new Array()};

function broadcastToPilots(sid){
    activePilots.forEach(p=>{if(p.open&&p.peer!==sid)p.send(state)});
}

function initObsHost(){
    peer=new Peer(OBS_ID);
    peer.on('connection',(c)=>{
        activePilots.push(c);
        c.on('open',()=>c.send(state));
        c.on('data',(d)=>{
            state=d;
            if(!state.penalties)state.penalties=new Array();
            localStorage.setItem('pzs4_state',JSON.stringify(state));
            renderUI();
            broadcastToPilots(c.peer);
        });
        c.on('close',()=>{activePilots=activePilots.filter(p=>p.peer!==c.peer)});
    });
}

function connectToObs(){
    const st=document.getElementById('conn-status');
    st.style.background='#f33';st.innerText='🔴 ŁĄCZENIE Z OBS...';
    conn=peer.connect(OBS_ID,{reliable:true});
    conn.on('open',()=>{
        st.style.background='#0a5';st.innerText='🟢 POŁĄCZONO Z OBS (MULTI-PILOT)';
    });
    conn.on('data',(d)=>{if(d&&d.homeName){state=d;renderUI()}});
    conn.on('close',()=>{
        st.style.background='#f33';st.innerText='🔴 ROZŁĄCZONO - PONAWIAM...';
        setTimeout(connectToObs,2000);
    });
    connKary=peer.connect("pzs4-wejherowo-kary-host-2026",{reliable:true});
    connKary.on('open',()=>connKary.send(state));
    connZmiany=peer.connect("pzs4-wejherowo-zmiany-host-2026",{reliable:true});
}

function openPilot(){
    isPilot=true;
    document.getElementById('control-panel').style.display='block';
    document.getElementById('obs-wrapper').style.position='relative';
    document.getElementById('obs-wrapper').style.marginTop='15px';
    document.getElementById('open-control-btn').style.display='none';
    if(peer)peer.destroy();
    peer=new Peer();
    peer.on('open',()=>connectToObs());
}

function sendState(){
    localStorage.setItem('pzs4_state',JSON.stringify(state));
    renderUI();
    if(conn&&conn.open)conn.send(state);
    if(connKary&&connKary.open)connKary.send(state);
}

function renderUI(){
    document.getElementById('display-home-name').innerText=state.homeName;
    document.getElementById('display-away-name').innerText=state.awayName;
    const hL=document.getElementById('display-home-logo');if(state.homeLogo){hL.src=state.homeLogo;hL.style.display="block"}else{hL.style.display="none"}
    const aL=document.getElementById('display-away-logo');if(state.awayLogo){aL.src=state.awayLogo;aL.style.display="block"}else{aL.style.display="none"}
    document.getElementById('display-home-score').innerText=state.homeScore;
    document.getElementById('display-away-score').innerText=state.awayScore;
    document.getElementById('obs-period').innerText=state.period||1;
    let m=Math.floor(state.time/60).toString().padStart(2,'0'),s=(state.time%60).toString().padStart(2,'0');
    document.getElementById('obs-timer').innerText=`${m}:${s}`;
    if(isPilot){
        if(document.activeElement.tagName!=='INPUT'){
            document.getElementById('input-home-name').value=state.homeName;
            document.getElementById('input-away-name').value=state.awayName;
            document.getElementById('input-home-logo').value=state.homeLogo;
            document.getElementById('input-away-logo').value=state.awayLogo;
            document.getElementById('input-target-time').value=state.targetTime||12;
        }
        document.getElementById('panel-home-title').innerText=state.homeName;
        document.getElementById('panel-away-title').innerText=state.awayName;
        document.getElementById('opt-home').innerText=state.homeName;
        document.getElementById('opt-away').innerText=state.awayName;
        document.getElementById('sub-opt-home').innerText=state.homeName;
        document.getElementById('sub-opt-away').innerText=state.awayName;
        document.getElementById('panel-period-val').innerText=state.period||1;
        const pList=document.getElementById('active-penalties-list');pList.innerHTML='';
        if(state.penalties){
            state.penalties.forEach((p,idx)=>{
                let pm=Math.floor(p.timeLeft/60).toString().padStart(2,'0'),ps=(p.timeLeft%60).toString().padStart(2,'0');
                pList.innerHTML+=`<div class="pen-tag">${p.team} ${p.num} (${pm}:${ps}) <button onclick="removePenalty(${idx})" style="background:#000;color:#fff;border:none;cursor:pointer;padding:2px 6px">X</button></div>`;
            });
        }
    }
}

function changeScore(t,v){if(t==='home')state.homeScore=Math.max(0,state.homeScore+v);if(t==='away')state.awayScore=Math.max(0,state.awayScore+v);sendState()}
function changePeriod(v){state.period=Math.max(1,(state.period||1)+v);sendState()}
function updateSettings(){state.homeName=document.getElementById('input-home-name').value||"GOSPODARZE";state.awayName=document.getElementById('input-away-name').value||"GOŚCIE";state.homeLogo=document.getElementById('input-home-logo').value||"";state.awayLogo=document.getElementById('input-away-logo').value||"";state.targetTime=parseInt(document.getElementById('input-target-time').value)||12;sendState()}
function addPenalty(){const num=document.getElementById('pen-num').value;const mins=parseInt(document.getElementById('pen-mins').value)||2;const teamSide=document.getElementById('pen-team').value;if(!num)return alert("Wpisz numer!");const teamName=teamSide==='home'?state.homeName:state.awayName;state.penalties.push({id:Date.now(),team:teamName,num:num,timeLeft:mins*60});document.getElementById('pen-num').value='';sendState()}
function removePenalty(idx){state.penalties.splice(idx,1);sendState()}

function sendSub(){
    const outN=document.getElementById('sub-out-num').value,inN=document.getElementById('sub-in-num').value,side=document.getElementById('sub-team-sel').value;
    if(!outN||!inN)return alert("Wpisz oba numery!");
    const tName=side==='home'?state.homeName:state.awayName;
    if(connZmiany&&connZmiany.open)connZmiany.send({type:'sub',team:tName,outNum:outN,inNum:inN});
    document.getElementById('sub-out-num').value='';
    document.getElementById('sub-in-num').value='';
}

function swapSides(){
    const tmpName=state.homeName; state.homeName=state.awayName; state.awayName=tmpName;
    const tmpLogo=state.homeLogo; state.homeLogo=state.awayLogo; state.awayLogo=tmpLogo;
    const tmpScore=state.homeScore; state.homeScore=state.awayScore; state.awayScore=tmpScore;
    sendState();
}

function toggleTimer(){
    isRunning=!isRunning;
    if(isRunning){
        timer=setInterval(()=>{
            state.time++;
            if(state.penalties){state.penalties.forEach(p=>p.timeLeft--);state.penalties=state.penalties.filter(p=>p.timeLeft>0)}
            const limit=(parseInt(document.getElementById('input-target-time').value)||12)*60;
            if(state.time>=limit){
                clearInterval(timer);isRunning=false;state.time=limit;sendState();
                setTimeout(()=>{
                    state.time=0;
                    state.period=(state.period||1)+1;
                    swapSides();
                },3000);
            }else{sendState()}
        },1000);
    }else{clearInterval(timer)}
}

function resetTimerOnly(){if(confirm("Zresetować CZAS do 00:00?")){clearInterval(timer);isRunning=false;state.time=0;sendState()}}
function resetAll(){if(confirm("Zresetować CAŁY MECZ?")){clearInterval(timer);isRunning=false;state={homeName:"GOSPODARZE",awayName:"GOŚCIE",homeLogo:"",awayLogo:"",homeScore:0,awayScore:0,time:0,targetTime:12,period:1,penalties:new Array()};sendState()}}

const lib=document.createElement('script');
lib.src="https:"+"//unpkg.com"+"/peerjs@1.5.4"+"/dist/peerjs.min.js";
lib.onload=()=>{renderUI();initObsHost()};
document.head.appendChild(lib);
</script>
</body>
</html>
